name: Update projections
# Every hour: pull fresh stats, injuries, news, expert projections and Vegas lines, rebuild,
# and redeploy only if something users would see changed. Also runs when the app or model code changes.
on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ['app.html', 'fonts/**', 'pipeline.py', 'kickers.py', 'defense.py', 'news.py', 'status.py', 'tests/**', 'build_site.py', '.github/workflows/update.yml']
permissions:
  contents: write
  pages: write
  id-token: write   # GitHub Pages deploy
concurrency:
  group: update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.check.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12', cache: 'pip' }
      - id: day
        run: echo "day=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      # past seasons never change; Sleeper's player file is fetched at most once a day. One cache entry per day.
      - uses: actions/cache@v4
        with:
          path: cache
          key: nfl-cache-${{ steps.day.outputs.day }}
          restore-keys: nfl-cache-
      - run: pip install -r requirements.txt
      - name: Probe ESPN league (temporary)
        continue-on-error: true
        run: |
          B="https://lm-api-reads.fantasy.espn.com/apis/v3/games/ffl/seasons/2026/segments/0/leagues/370896190"
          for v in mSettings mTeam mRoster mMatchup; do
            code=$(curl -s -o $v.json -w '%{http_code}' "$B?view=$v")
            echo "::notice title=league::$v $code $(wc -c < $v.json) bytes $(head -c 100 $v.json | tr -d '\n')"
          done
          mkdir -p probe && mv m*.json probe/ || true
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with: { name: league-probe, path: probe, retention-days: 1 }
      - name: Status rules still pass (if not, the live site keeps its last good version)
        run: python tests/test_status.py
      - run: python pipeline.py
      - run: python build_site.py
      - id: check
        name: Did anything change?
        run: |
          new=$(cat site/hash.txt)
          old=$(curl -fsSL "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/hash.txt" || echo none)
          if [ "$new" != "$old" ] || [ "${{ github.event_name }}" != "schedule" ]; then echo "changed=true" >> "$GITHUB_OUTPUT"; else echo "changed=false" >> "$GITHUB_OUTPUT"; echo "No changes since last deploy"; fi
      - name: Save weekly snapshots (used to score model vs experts)
        run: |
          git config user.name "startsit-bot"
          git config user.email "actions@users.noreply.github.com"
          git add history
          git diff --cached --quiet || (git commit -m "snapshot $(date -u +%F)" && git pull --rebase -q && git push)
      - if: steps.check.outputs.changed == 'true'
        uses: actions/configure-pages@v5
      - if: steps.check.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v3
        with: { path: site }
  deploy:
    needs: update
    if: needs.update.outputs.changed == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
