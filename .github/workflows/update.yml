name: Update projections
# Runs on the schedule below, on manual "Run workflow", and when the app or pipeline changes.
on:
  schedule:
    # times are UTC. Mon: Sunday's results. Tue: after Monday night. Wed–Fri: injury reports. Sat. Sun 11:30am ET before kickoff.
    - cron: '0 14 * * 1'
    - cron: '0 12 * * 2'
    - cron: '0 22 * * 3,4,5'
    - cron: '0 16 * * 6'
    - cron: '30 15 * * 0'
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ['app.html', 'pipeline.py', 'kickers.py', 'defense.py', 'build_site.py', '.github/workflows/update.yml']
permissions:
  contents: write
  pages: write
  id-token: write   # GitHub Pages deploy
concurrency:
  group: update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/cache@v4
        with:
          path: cache
          key: nfl-cache-${{ github.run_id }}
          restore-keys: nfl-cache-
      - run: pip install -r requirements.txt
      - run: python pipeline.py
      - run: python build_site.py
      - name: Save weekly snapshots (used to score model vs experts)
        run: |
          git config user.name "startsit-bot"
          git config user.email "actions@users.noreply.github.com"
          git add history
          git diff --cached --quiet || git commit -m "snapshot $(date -u +%F)"
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
