name: Probe ESPN fantasy API
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ['.github/workflows/probe.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for u in \
            "https://lm-api-reads.fantasy.espn.com/apis/v3/games/ffl/seasons/2026?view=proTeamSchedules_wl" \
            "https://lm-api-reads.fantasy.espn.com/apis/v3/games/ffl/seasons/2026/segments/0/leagues/1?view=mTeam" ; do
            code=$(curl -s -o body.json -D h.txt -w '%{http_code}' -H 'Origin: https://brockwilson132.github.io' "$u")
            acao=$(grep -i '^access-control-allow-origin' h.txt | tr -d '\r' | cut -c1-120)
            acac=$(grep -i '^access-control-allow-credentials' h.txt | tr -d '\r')
            echo "::notice title=probe::$code | $acao | $acac | $(head -c 160 body.json | tr -d '\n') | $u"
            pf=$(curl -s -o /dev/null -D p.txt -w '%{http_code}' -X OPTIONS -H 'Origin: https://brockwilson132.github.io' -H 'Access-Control-Request-Method: GET' -H 'Access-Control-Request-Headers: x-fantasy-filter' "$u")
            echo "::notice title=preflight::$pf | $(grep -i '^access-control' p.txt | tr -d '\r' | tr '\n' ' ' | cut -c1-300)"
          done
