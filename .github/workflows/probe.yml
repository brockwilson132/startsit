name: Probe data sources
on:
  push:
    branches: [probe]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch samples
        run: |
          mkdir -p probe
          ua="Mozilla/5.0 (startsit)"
          get(){ curl -sL -A "$ua" -w "\n%{http_code} %{size_download} %{time_total}\n" "$2" -o "probe/$1" > "probe/$1.status"; echo "$1: $(tail -1 probe/$1.status)"; }
          get espn_news.json "https://site.api.espn.com/apis/site/v2/sports/football/nfl/news?limit=100"
          get espn_injuries.json "https://site.api.espn.com/apis/site/v2/sports/football/nfl/injuries"
          get espn_athlete_news.json "https://site.api.espn.com/apis/common/v3/sports/football/nfl/athletes/3116406/news"
          get espn_athlete.json "https://site.api.espn.com/apis/common/v3/sports/football/nfl/athletes/3116406"
          get sleeper_players.json "https://api.sleeper.app/v1/players/nfl"
          get sleeper_trending.json "https://api.sleeper.app/v1/players/nfl/trending/add?lookback_hours=24&limit=50"
          get espn_fa.json "https://sports.core.api.espn.com/v2/sports/football/leagues/nfl/freeagents?limit=200"
          python3 - <<'PY'
          import json, os
          # keep the big Sleeper file small: only fantasy positions, selected fields
          p = json.load(open('probe/sleeper_players.json'))
          keep = {k: {f: v.get(f) for f in ['full_name','team','position','status','injury_status','injury_body_part','injury_notes','injury_start_date','news_updated','active','gsis_id','espn_id','search_rank','depth_chart_order','depth_chart_position','practice_participation']}
                  for k, v in p.items() if v.get('position') in ('QB','RB','WR','TE','K') and (v.get('search_rank') or 9999) < 600}
          json.dump(keep, open('probe/sleeper_players_small.json','w'), indent=0)
          os.remove('probe/sleeper_players.json')
          print('sleeper kept', len(keep))
          PY
          ls -la probe
      - name: Save
        run: |
          git config user.name "startsit-bot"; git config user.email "actions@users.noreply.github.com"
          git add probe; git commit -m "probe samples" || true; git push
