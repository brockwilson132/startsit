/* ---------- week chart ----------
   One chart for every ranking row and every player detail: Weeks 1-18 on a fixed x axis and a fixed y scale per
   position group, so a bar means the same thing wherever it appears. What fills each week:
   played: the pre-game projection as a neutral column, plus the gap to what he scored (green above it, red outline
           for the shortfall); this week: the projection with its likely range; later weeks: projections, hatched.
   Each view highlights the weeks it is about and dims the rest. */
const NWK=18;
let _seaById=null,_seaSrc=null;
const seaOf=id=>{if(_seaSrc!==DATA.season){_seaSrc=DATA.season;_seaById=Object.fromEntries(SEA().map(s=>[s.id,s]))}return _seaById[id]};
function ppScale(s){if(S==='proj')return 1;let a=0,b=0;s.wp.forEach((x,i)=>{if(x!=null&&s.ws[i]!=null){a+=x;b+=s.ws[i]}});const r=a>0?b/a:1;return S==='std'?r:(1+r)/2}
const yCap=pos=>pos==='K'?20:pos==='DST'?24:40;
function weekSeries(id){
  const s=seaOf(id), p=byId[id], w=wById[id], pts=s?wkPts(s):[], k=s?ppScale(s):1, out=[];
  const byes=new Set([...(s?s.bye:[]),...(p&&p.bye?[M.week]:[])]);
  for(let wk=1;wk<=NWK;wk++){const o={wk};
    if(wk<M.week){
      if(byes.has(wk))o.t='bye';
      else{const a=pts[wk-1];o.t=a==null?'out':'past';o.act=a;const pp=s&&s.pp?s.pp[wk-1]:null;if(pp!=null){o.pj=pp*k;o.src=s.ps[wk-1]}}}
    else if(wk===M.week){
      if(p){if(p.bye)o.t='bye';else if(p.final&&actual(p)!=null){o.t='past';o.act=actual(p);o.pj=val(p);o.src=1}else if(inactive(p))o.t='out';else{o.t='now';o.pj=val(p);o.lo=p.lo*scale(p);o.hi=p.hi*scale(p)}}
      else if(w){const x=w.wk[0];o.t=x==null?(byes.has(wk)?'bye':'out'):'now';if(x!=null)o.pj=x*wsc(w)}
      else o.t='none'}
    else{const x=w?w.wk[wk-M.week]:undefined;
      if(x==null)o.t=byes.has(wk)?'bye':w&&x===null?'out':'none';else{o.t='next';o.pj=x*wsc(w)}}
    out.push(o)}
  return out}
/* which weeks a view is about: the sorted metric's own window when it has one, else the period's */
function emphFor(view,em,ser){
  em=em||{week:'week',season:'past',ros:'future'}[view];
  if(em==='week')return c=>c.wk===M.week;
  if(em==='future')return c=>c.wk>=M.week;
  if(em==='n4')return c=>c.wk>=M.week&&c.wk<M.week+4;
  if(em==='l3'){const l=ser.filter(c=>c.t==='past').slice(-3).map(c=>c.wk);return c=>l.includes(c.wk)}
  return c=>c.wk<M.week||(c.wk===M.week&&c.t==='past')}
function weekChart(ser,o){
  /* past weeks: one solid bar = what he scored, green when he beat his pre-game projection, red when short,
     with a dark tick at the projection. This week: yellow projection with its likely range. Later: hatched projections.
     A dashed line marks his average in games played. Values print on top so the chart reads without tapping. */
  const ym=o.ymax, Y=v=>Math.max(0,Math.min(100,v/ym*100)), emph=o.emph||(()=>true), big=!!o.big;
  const pastV=ser.filter(c=>c.t==='past').map(c=>c.act), avg=pastV.length?sum(pastV)/pastV.length:null;
  const lab=(v,top)=>big?`<em class="vl" style="bottom:calc(${Math.min(top,100)}% + 2px)">${fmt(v,0)}</em>`:'';
  const cells=ser.map(c=>{let h='';
    if(c.t==='past'){const a=Math.max(0,c.act),cls=c.pj==null?'':a>=c.pj?' beat':' miss';
      h=`<i class="b act${cls}" style="height:${Math.max(a>0?2:1,Y(a))}%"></i>${c.pj!=null?`<i class="pj" style="bottom:${Y(c.pj)}%"></i>`:''}${lab(c.act,cls===' miss'?Y(a):Math.max(Y(a),c.pj!=null?Y(c.pj):0))}`;
      if(a>ym)h+=`<i class="over"></i>`}
    else if(c.t==='now')h=(c.hi!=null?`<i class="rg" style="bottom:${Y(c.lo)}%;height:${Y(c.hi)-Y(c.lo)}%"></i>`:'')+`<i class="b now" style="height:${Math.max(3,Y(c.pj))}%"></i>${lab(c.pj,c.hi!=null?Y(c.hi):Y(c.pj))}`;
    else if(c.t==='next')h=`<i class="b fut" style="height:${Math.max(2,Y(c.pj))}%"></i>`;
    else if(c.t==='bye')h=`<i class="mk">${big?'B':''}</i>`;
    else if(c.t==='out')h=`<i class="mk out">${big?'×':''}</i>`;
    return `<span class="c${emph(c)?'':' dim'}${c.wk===M.week?' cur':''}${o.sel===c.wk?' sel':''}" data-w="${c.wk}">${h}</span>`}).join('');
  if(!big)return `<div class="wc" aria-hidden="true">${cells}</div>`;
  const ticks=[];for(let v=0;v<=ym;v+=ym>24?10:5)ticks.push(v);
  const nPast=ser.filter(c=>c.wk<M.week).length, avgLine=avg!=null&&nPast?`<i class="avg" style="bottom:${Y(avg)}%;width:${nPast/ser.length*100}%"></i>`:'';
  return `<div class="wc big" role="img" aria-label="${esc(o.label||'Points by week')}"><div class="wc-y">${ticks.map(v=>`<span style="bottom:${Y(v)}%">${v}</span>`).join('')}</div>
    <div class="wc-plot">${ticks.map(v=>`<i class="gl" style="bottom:${Y(v)}%"></i>`).join('')}${avgLine}${cells}</div>
    <div class="wc-x">${ser.map(c=>`<span class="${c.wk===M.week?'cur':''}">${c.wk===M.week||c.wk===1||c.wk%3===0?c.wk:''}</span>`).join('')}</div></div>`}
function readout(c,p){
  const d=c.pj!=null&&c.act!=null?c.act-c.pj:null, opp=c.wk===M.week&&p&&p.opp?` ${vs(p)}`:'';
  if(c.t==='past')return `<b>Week ${c.wk}</b>${opp}: scored <b>${fmt(c.act)}</b>${c.pj!=null?`, projected ${fmt(c.pj)} <span class="${d>=0?'up':'dn'}">(${d>=0?'+':'−'}${fmt(Math.abs(d))})</span>${c.src===0?' <small>model, reconstructed</small>':''}`:''}`;
  if(c.t==='now')return `<b>Week ${c.wk}</b>${opp}: projected <b>${fmt(c.pj)}</b>${c.hi!=null?`, likely ${fmt(c.lo,0)}–${fmt(c.hi,0)}`:''}`;
  if(c.t==='next')return `<b>Week ${c.wk}</b>: projected <b>${fmt(c.pj)}</b>`;
  return `<b>Week ${c.wk}</b>: ${c.t==='bye'?'bye':c.t==='out'?"didn't play":'no data'}`}
const KEY=`<div class="wc-key"><span><i class="k beat"></i>Beat projection</span><span><i class="k miss"></i>Fell short</span><span><i class="k pjk"></i>Pre-game projection</span><span><i class="k now"></i>Week ${M.week}</span><span><i class="k fut"></i>Projected</span></div>`;
function vsProj(ser){const d=ser.filter(c=>c.t==='past'&&c.pj!=null).map(c=>c.act-c.pj);return d.length?{n:d.length,beat:d.filter(x=>x>=0).length,avg:sum(d)/d.length}:null}

/* the player pool for a period, as metric contexts */
function rkPool(){
  const st=seasonStats(), stById=Object.fromEntries(st.map(r=>[r.p.id,r]));
  const ctx=id=>{const p=byId[id],s=seaOf(id),w=wById[id],o=p||s||w;return {id,p,s,w,st:stById[id],pos:o.pos,team:(p||w||s).team,name:o.name,ser:weekSeries(id)}};

const rowName=(n,mx=15)=>{if(n.length<=mx||n.endsWith(' D/ST'))return n;const w=n.split(' ');return w.length>1?w[0][0]+'. '+w.slice(1).join(' '):n};

/* how it works */

const HOW={
build(){
  const okP=q=>q&&q.pos!=='K'&&!q.bye&&q.src!=='experts'&&q.proj>0;const p=[byId[howPlayer],byId[picks[0]],...P].find(okP);if(!p)return '<p>No projections yet.</p>'; howPlayer=p.id; const k=scale(p);
  const steps=[['Baseline',(p.form+p.usage)*k,`Who ${p.name.split(' ').slice(-1)} is: points scored blended with what his usage is worth.`],
               ['Matchup',p.matchup*k,`${p.opp} allows ${p.xdef>0?'+':''}${fmt(p.xdef,0)}% vs expected to ${p.pos}s.`],

  const bars=steps.map(([l,v,t],j)=>{const start=j===0?0:run; run+=v; const a=Math.min(start,run),w=Math.abs(v);
    return `<div class="wf-row"><span class="wf-l">${l}</span><div class="wf-track"><div class="wf-bar ${j===0?'b':v<0?'n':'p'}" style="left:${a/top*100}%;width:${Math.max(.6,w/top*100)}%"></div></div><span class="wf-v">${j&&v>0?'+':''}${fmt(v)}</span></div><p class="wf-t">${t}</p>`}).join('');
  const opts=P.filter(q=>q.pos!=='K'&&!q.bye&&q.src!=='experts'&&q.proj>0).sort((a,b)=>a.name.localeCompare(b.name)).map(q=>`<option value="${q.id}" ${q.id===p.id?'selected':''}>${esc(q.name)} (${q.pos}, ${q.team})</option>`).join('');
  return `<h2>Baseline, then this week</h2>
  <p>Every projection starts with who the player is, then adjusts for this week's game.</p>
  <label class="sel">Pick any player <select id="howSel">${opts}</select></label>
  <div class="panel">${bars}<div class="wf-row total"><span class="wf-l">Projection</span><div class="wf-track"><div class="wf-bar t" style="left:0;width:${total/top*100}%"></div></div><span class="wf-v">${fmt(total)}</span></div></div>`},
baseline(){
  const c=M.coef[howPos], tu=c[1]/(c[0]+c[1]);
  return `<h2>Usage beats past points</h2>
  <p>Points include touchdowns and long plays that rarely repeat. Targets and carries do repeat. So the baseline leans on usage, and how much depends on the position.</p>
  <div class="chips" id="bpos">${['QB','RB','WR','TE'].map(q=>`<button data-p="${q}" aria-pressed="${q===howPos}">${q}</button>`).join('')}</div>
  <div class="split"><div class="split-u" style="width:${tu*100}%"><span>Usage ${Math.round(tu*100)}%</span></div><div class="split-p"><span>Points ${Math.round((1-tu)*100)}%</span></div></div>
  <p class="cap">${howPos==='RB'?'Running back workloads are the most stable thing in fantasy, so their baseline is almost all usage.':howPos==='WR'?'Receivers split it evenly: targets matter, but talent turns targets into points at very different rates.':howPos==='QB'?'Quarterbacks lean on usage, which for them is mostly rushing and pass volume.':'Tight ends lean on targets; their touchdowns are especially streaky.'}</p>
  <h3>Where a player starts</h3>
  <p>Early in the season the baseline leans on last season, then this season takes over game by game. A rookie starts from what past rookies at his position and draft round averaged as rookies, so a third-round starter isn't treated like an undrafted backup. A player who missed all of last season starts from the season before. And a Questionable or Doubtful player's projection counts the chance he sits: about 52% of players who missed practice all week play, 75% who were limited, 88% who were full, and 1% of Doubtful players.</p>
  <p>Usage here means targets, carries, air yards and red-zone looks. If a player's snap share is climbing, the model gives him extra credit before the points show up.</p>
  <p>Recent games count more: a game five weeks ago counts half as much as last week's. And when a regular is ruled out, on injured reserve or suspended, about three-quarters of his targets and carries are handed to his teammates, in proportion to their current roles. The card says when that's happening.</p>
  <p>Past points also get blended with last season, so a hot three-week start counts, but doesn't take over.</p>`},
norm(){
  return `<h2>Why normalize?</h2>

matchup(){
  const rows=DATA.defense[howPos];
  const ra=[...rows].sort((a,b)=>b.raw-a.raw).map(r=>r.team), ad=[...rows].sort((a,b)=>b.adj-a.adj).map(r=>r.team);
  const list=(defMode==='raw'?ra:ad).slice(0,8).map((t,j)=>{const r=rows.find(x=>x.team===t);const other=(defMode==='raw'?ad:ra).indexOf(t);const mv=other-j;

  return `<h2>Grade defenses on who they faced</h2>
  <p>A defense that faced three star receivers looks awful on raw points even if it isn't. So each defense is graded against what its opponents normally score.</p>

  <div class="seg" role="group" style="margin:8px 0 10px"><button data-m="raw" aria-pressed="${defMode==='raw'}">Raw points allowed</button><button data-m="adj" aria-pressed="${defMode==='adj'}">Adjusted</button></div>
  <p class="cap">Easiest matchups, this season. Toggle to see who moves.</p>

  // 3. waiver upgrades for the rest of the season: free agent vs your least valuable bench player at any position
  const luR=entries=>bestLineup(entries,L.slots,rosV).total, myBase=luR(mine);
  const fas=W.filter(w=>!taken.has(w.id)&&!['K','DST'].includes(w.pos)&&w.status!=='FA').sort((a,b)=>rosT(b)-rosT(a)).slice(0,60);
  const droppable=mine.filter(x=>x.w&&!['K','DST'].includes(x.w.pos)&&x.slot!==21);
  const wvIdeas=[];
  fas.forEach(a=>{const ax={espn:'fa'+a.id,name:a.name,w:a,p:byId[a.id]};let best=null;
    droppable.forEach(d=>{const g=luR(mine.filter(x=>x!==d).concat([ax]))-myBase+.2*(rosT(a)-rosT(d.w));if(!best||g>best.g)best={a,d,g}});
    if(best&&best.g>=8)wvIdeas.push(best)});
  const usedDrop=new Set();
  wvIdeas.sort((x,y)=>y.g-x.g).forEach(m=>{if(usedDrop.size>=3||usedDrop.has(m.d.espn))return;usedDrop.add(m.d.espn);
    out.push({kind:'waiver',score:m.g/2,icon:'up',title:`Add ${short(m.a.name)}, drop ${short(m.d.name)}`,sub:`+${fmt(m.g,0)} pts rest of season · ${m.a.own==null?'<5':m.a.own}% rostered`,
      act:{type:'wv',drop:m.d.w.id,add:m.a.id},tone:'up'})});
  // 4. streaming kicker and defense for this week
  ['K','DST'].forEach(pos=>{const cur=mine.filter(x=>x.p&&x.p.pos===pos).sort((a,b)=>wk(b.p)-wk(a.p))[0];if(cur&&locked(cur.p))return;
    const best=P.filter(q=>q.pos===pos&&live(q)&&!taken.has(q.id)).sort((a,b)=>val(b)-val(a))[0];
    const g=best?val(best)-(cur?wk(cur.p):0):0;
    if(best&&g>=2)out.push({kind:'stream',score:g*1.5,icon:pos==='K'?'goal':'shield',title:`Stream ${short(best.name)} at ${pos==='DST'?'D/ST':'K'}`,sub:`+${fmt(g)} pts this week${cur?' over '+short(cur.name):''}`,act:{type:'add',id:best.id},tone:'up'})});
  // 5. trades that help both sides' starting lineups for the rest of the season (1-for-1)
  const lu=luR, ideas=[];
  L.teams.filter(t=>t.id!==me.id).forEach(t=>{const theirs=teamEntries(t),theirBase=lu(theirs);
    mine.forEach(a=>{if(!a.w||['K','DST'].includes(a.w.pos))return;theirs.forEach(b=>{if(!b.w||['K','DST'].includes(b.w.pos)||b.w.pos===a.w.pos)return;
      const ra=rosT(a.w),rb=rosT(b.w);if(rb<ra*.6||rb>ra*1.6)return;      // roughly fair on raw value
      const g1=lu(mine.filter(x=>x!==a).concat([b]))-myBase;if(g1<8)return;
      const g2=lu(theirs.filter(x=>x!==b).concat([a]))-theirBase;if(g2<=0)return;
      ideas.push({t,a,b,g1,g2})})})});
  ideas.sort((x,y)=>Math.min(y.g1,y.g2*2)-Math.min(x.g1,x.g2*2)).slice(0,3).forEach(m=>
    out.push({kind:'trade',score:m.g1/3,icon:'turn',title:`Trade ${short(m.a.name)} for ${short(m.b.name)}`,sub:`with ${esc(m.t.name)} · you +${fmt(m.g1,0)}, them +${fmt(m.g2,0)} rest of season`,act:{type:'trade',a:m.a.w.id,b:m.b.w.id},tone:'up'}));
  // 6. news on my players
  mine.forEach(x=>{const p=x.p;if(!p)return;const i=inj(p),isStart=x.slot!==20;
    if(p.upd)out.push({kind:'news',score:15,icon:'news',title:`${short(x.name)}: ${p.upd.what}`,sub:`${p.upd.src}, ${shortDate(p.upd.date)}`,act:{type:'open',id:p.id},tone:/IR|Released|Suspended|exempt|Not on/.test(p.upd.what)?'bad':'up'});
    else if(i&&isStart&&live(p))out.push({kind:'injury',score:i.lvl==='out'?18:i.lvl==='bad'?12:6,icon:'cross',title:`${short(x.name)} is ${SHORTTAG[i.tag]||i.tag}`,sub:i.txt,act:{type:'open',id:p.id},tone:i.lvl==='warn'?'warn':'bad'});
    if(p.qb&&p.qb_adj&&Math.abs(p.qb_adj)>=.5)out.push({kind:'qb',score:4,icon:'throw',title:`${short(x.name)}: ${p.qb.new} at QB`,sub:`${p.qb_adj>0?'+':''}${fmt(p.qb_adj*scale(p))} pts vs with ${p.qb.old}`,act:{type:'open',id:p.id},tone:p.qb_adj>0?'up':'bad'})});
  return out.sort((a,b)=>b.score-a.score)}

let lgBusy=false, lgErr=null, lgPending='';
async function connectLeague(input){
  const id=leagueIdFrom(input);lgPending=id||String(input||'');if(!id){lgErr='Paste the league link from ESPN, or just the number after leagueId=';renderTeam();return}
  lgBusy=true;lgErr=null;renderTeam();
  try{const data=await fetchLeague(id);LG={id,team:LG&&LG.id===id?LG.team:null,at:Date.now(),data};store.set('ss_league',LG);
    if(data.fmt!==S){S=data.fmt;store.set('ss_scoring',S);$$('.fmt button').forEach(x=>x.setAttribute('aria-pressed',x.dataset.s===S))}}
  catch(e){lgErr=e.code==='private'?'private':e.code==='badauth'?'badauth':e.code==='missing'?'No league with that ID for this season.':e.code==='network'?(e.where==='relay'?'relaynet':'Couldn\'t reach ESPN. An ad or content blocker may be blocking it; try turning it off for this site.'):`ESPN returned an error (${e.status}).`}
  lgBusy=false;renderTeam()}
async function refreshLeague(force){if(!LG||!LG.id)return;if(!force&&LG.at&&Date.now()-LG.at<10*60e3)return;
  try{const data=await fetchLeague(LG.id);LG={...LG,at:Date.now(),data};store.set('ss_league',LG);if(tab==='team')renderTeam()}catch(e){}}
function privateHelp(){
  if(!RELAY)return `<div class="alert bad" style="margin-top:12px;text-align:left"><span class="ai">${ic('cross')}</span><span><b>This league is private.</b> Private leagues need the app's relay, which isn't set up yet. Or the League Manager can turn on “Make League Viewable to Public” (LM Tools → Basic Settings).</span></div>`;
  return `<div class="pv">${lgErr==='relaynet'?`<p class="err">This device can't reach the app's relay (some work networks and blockers block Cloudflare's workers.dev). Finish on your phone instead, or try another network.</p>`:lgErr==='badformat'?`<p class="err">Those don't look like ESPN's values. espn_s2 is a long string starting with AEB; SWID looks like {XXXXXXXX-XXXX-XXXX-XXXX-XXXXXXXXXXXX}. Copy just the Value column.</p>`:lgErr==='badauth'?`<p class="err">ESPN didn't accept those cookies. Copy them again; they change when you log out.</p>`:`<p><b>Private league.</b> Add your ESPN cookies once. They stay on this device and only go to ESPN.</p>`}
    <form id="authForm"><label>espn_s2<input id="s2In" autocomplete="off" spellcheck="false" placeholder="AEB…" value="${esc(AUTH&&AUTH.s2||'')}"></label>
      <label>SWID<input id="swidIn" autocomplete="off" spellcheck="false" placeholder="{XXXXXXXX-XXXX-…}" value="${esc(AUTH&&AUTH.swid||'')}"></label>
      <button class="btn">Connect privately</button>
      <button type="button" class="btn ghost" id="toPhone">Finish on my phone instead</button>
      ${AUTH?`<button type="button" class="linkish" id="forgetAuth" style="align-self:center;margin-top:4px">Remove saved cookies and league from this device</button>`:''}</form>
    <p class="cap" id="toPhoneMsg" hidden></p>
    <details><summary>Where do I find these?</summary><ol>
      <li>On a computer, log in at <b>fantasy.espn.com</b> in Chrome.</li>
      <li>Right-click the page → <b>Inspect</b> → <b>Application</b> tab → <b>Cookies</b> → <b>https://fantasy.espn.com</b>.</li>
      <li>Copy the values of <b>espn_s2</b> and <b>SWID</b> into the boxes above.</li>
      <li>Then, from the Team tab menu, copy your <b>phone setup link</b> and open it on your phone.</li></ol>
      <p class="cap">Safari: Settings → Advanced → “Show features for web developers”, then Develop → Show Web Inspector → Storage → Cookies.</p></details></div>`}
/* one link that sets up another device (league, team, cookies). The part after # never reaches any server. */
function setupLink(o){o=o||{id:LG.id,team:LG.team,a:AUTH||null};const b=btoa(unescape(encodeURIComponent(JSON.stringify(o)))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
  return location.origin+location.pathname+'#setup='+b}
function readSetup(){const m=location.hash.match(/^#setup=([\w-]+)$/);if(!m)return false;
  try{const j=JSON.parse(decodeURIComponent(escape(atob(m[1].replace(/-/g,'+').replace(/_/g,'/')))));
    if(j.a&&j.a.s2&&j.a.swid){AUTH=j.a;store.set('ss_espn_auth',AUTH)}
    LG={id:String(j.id),team:j.team==null?null:+j.team,at:0,data:null};store.set('ss_league',LG);tab='team';store.set('ss_tab','team')}catch(e){}
  history.replaceState(null,'',location.pathname);return true}
let tmMenu=false;
function renderTeam(){
  const el=$('#s-team');indexEspn();
  if(!LG||!LG.data){
    el.innerHTML=`<h2 class="h2" style="margin-top:10px">My team</h2>
    <div class="connect"><div class="cn-ic">${ic('users')}</div><b>Connect your ESPN league</b><p>Paste your league's link. The app reads rosters from ESPN on this phone only; no login.</p>
      <form id="lgForm"><input id="lgIn" inputmode="url" autocomplete="off" placeholder="fantasy.espn.com/…leagueId=123456" value="${esc(LG&&LG.id||lgPending||'')}"><button class="btn" ${lgBusy?'disabled':''}>${lgBusy?'Connecting…':'Connect'}</button></form>
      ${['private','badauth','badformat','relaynet'].includes(lgErr)?privateHelp():lgErr?`<p class="err">${esc(lgErr)}</p>`:''}</div>`;
    $('#lgForm').onsubmit=e=>{e.preventDefault();connectLeague($('#lgIn').value)};
    const tp=$('#toPhone');if(tp)tp.onclick=async()=>{const id=leagueIdFrom($('#lgIn').value)||lgPending, s2c=cleanS2($('#s2In').value), swc=cleanSwid($('#swidIn').value);
      const msg=$('#toPhoneMsg');msg.hidden=false;
      if(!id||s2c.length<20||!swc){msg.textContent='Fill in the league and both cookie boxes first.';return}
      const u=setupLink({id,team:null,a:{s2:s2c,swid:swc}});
      try{if(navigator.share){await navigator.share({title:'Start/Sit setup',url:u});msg.textContent='Open the link on your phone.'}
        else{await navigator.clipboard.writeText(u);msg.textContent='Link copied. Send it to yourself (only yourself; it contains your ESPN cookies) and open it on your phone.'}}
      catch(e){prompt('Copy this link and open it on your phone (it contains your ESPN cookies, so send it only to yourself):',u)}};
    const fa=$('#forgetAuth');if(fa)fa.onclick=()=>{AUTH=null;store.set('ss_espn_auth',null);LG=null;store.set('ss_league',null);lgPending='';lgErr=null;renderTeam()};
    const af=$('#authForm');if(af)af.onsubmit=e=>{e.preventDefault();const s2=$('#s2In').value.trim(),swid=$('#swidIn').value.trim();
      const s2c=cleanS2(s2), swc=cleanSwid(swid);
      if(s2c.length<20||!swc){lgErr='badformat';renderTeam();return}
      AUTH={s2:s2c,swid:swc};store.set('ss_espn_auth',AUTH);connectLeague($('#lgIn').value)};
    return}
  const L=LG.data;
  if(LG.team==null||!myTeam()){
    el.innerHTML=`<h2 class="h2" style="margin-top:10px">Which team is yours?</h2><p class="cap">${esc(L.name)}</p>
    <div class="list">${L.teams.map(t=>`<button class="li tm-pick" data-team="${t.id}"><span class="rk">${esc(t.abbrev)}</span><span></span><span style="min-width:0"><div class="nm">${esc(t.name)}</div><div class="sub">${esc(t.owner)}</div></span><span>${ic('flip')}</span></button>`).join('')}</div>
    <p class="cap" style="margin-top:10px"><button class="linkish" id="lgReset">Use a different league</button></p>`;
    $$('#s-team [data-team]').forEach(b=>b.onclick=()=>{LG.team=+b.dataset.team;store.set('ss_league',LG);renderTeam()});
    $('#lgReset').onclick=()=>{LG=null;store.set('ss_league',null);renderTeam()};return}
  const me=myTeam(), mine=teamEntries(me), mv=moves();
  const opt=lineupNow(mine,L), startIds=new Set(opt.starters.filter(s=>s.x).map(s=>s.x.espn));
  const cur=mine.filter(x=>x.slot!==20&&x.slot!==21), curPts=cur.reduce((a,x)=>a+wk(x.p),0);
  const lineRow=s=>{const x=s.x;if(!x)return `<div class="lu-row empty"><span class="lu-s">${SLOT_NAME[s.slot]}</span><span class="muted">Nobody healthy</span><span></span></div>`;
    const p=x.p||x.w, moved=x.slot===20||x.slot===21;
    return `<div class="lu-row${moved?' moved':''}" data-open="${p.id}"><span class="lu-s">${SLOT_NAME[s.slot]}</span>
      <span class="lu-p">${crest(p.team,22)}<span style="min-width:0"><b>${esc(x.name||p.name)}</b><small>${x.p?(x.p.bye?'Bye':x.p.final?'Final':vs(x.p)+' · '+fmtTime(x.p)):'No game data'}${moved?` · <em>from bench</em>`:''}</small></span></span>
      <span class="lu-v">${s.lock?ic('clock'):''}${x.p&&x.p.final&&actual(x.p)!=null?fmt(actual(x.p)):fmt(wk(x.p))}</span></div>`};
  el.innerHTML=`<div class="tm-head"><div><h2 class="h2">${esc(me.name)}</h2><p class="cap">${esc(L.name)} · Week ${M.week}</p></div><button class="iconbtn" id="lgMenu" aria-label="League settings" aria-expanded="${tmMenu}">${ic('users')}</button></div>
    ${tmMenu?`<div class="tm-menu"><button id="tmSwitch">${ic('flip')}Switch team</button><button id="tmLeague">${ic('users')}Use a different league</button>
      <button id="tmLink">${ic('news')}${AUTH?'Phone setup link (includes your ESPN cookies: send only to yourself)':'Phone setup link'}</button>
      ${AUTH?`<button id="tmForget" class="danger">${ic('x')}Remove my ESPN cookies from this device</button>`:''}</div>`:''}
    <div class="sec-h"><h3>Moves</h3><small>${mv.length?mv.length+' ideas':''}</small></div>
    ${mv.length?`<div class="moves">${mv.slice(0,8).map((m,i)=>`<button class="mv ${m.tone}" data-mv="${i}"><span class="mv-i">${ic(m.icon)}</span><span class="mv-t"><b>${esc(m.title)}</b><small>${m.sub}</small></span>${ic('flip')}</button>`).join('')}</div>`
      :`<div class="empty"><b>Nothing to change</b>Your lineup is set and no free agent beats your bench.</div>`}
    <div class="sec-h"><h3>Best lineup</h3><small>${fmt(opt.total)} pts${opt.total-curPts>=.3?` · +${fmt(opt.total-curPts)} vs now`:''}</small></div>
    <div class="list lu">${opt.starters.map(lineRow).join('')}</div>
    <div class="sec-h"><h3>Bench</h3></div>
    <div class="list lu">${mine.filter(x=>!startIds.has(x.espn)).map(x=>{const p=x.p||x.w;return p?`<div class="lu-row bench" data-open="${p.id}"><span class="lu-s">${x.slot===21?'IR':'BN'}</span><span class="lu-p">${crest(p.team,22)}<span style="min-width:0"><b>${esc(x.name||p.name)}</b><small>${p.pos}${x.w?' · '+fmt(rosT(x.w),0)+' rest of yr':''}</small></span></span><span class="lu-v">${x.p?fmt(wk(x.p)):''}</span></div>`:`<div class="lu-row bench"><span class="lu-s">BN</span><span class="lu-p"><span><b>${esc(x.name)}</b><small>Not in our data</small></span></span><span></span></div>`}).join('')}</div>
    <p class="cap" style="margin-top:10px">From ESPN ${LG.at?'at '+new Date(LG.at).toLocaleTimeString([], {hour:'numeric',minute:'2-digit'}):''} · <button class="linkish" id="lgRefresh">Refresh</button></p>`;
  $$('#s-team [data-mv]').forEach(b=>b.onclick=()=>doMove(mv[+b.dataset.mv]));
  $$('#s-team [data-open]').forEach(b=>b.onclick=()=>{const id=b.dataset.open;if(byId[id]){picks=[id];save();goCmp('week')}});
  $('#lgRefresh').onclick=()=>{LG.at=0;refreshLeague(true)};
  $('#lgMenu').onclick=()=>{tmMenu=!tmMenu;renderTeam()};
  if(tmMenu){$('#tmSwitch').onclick=()=>{tmMenu=false;LG.team=null;store.set('ss_league',LG);renderTeam()};
    $('#tmLeague').onclick=()=>{tmMenu=false;LG=null;store.set('ss_league',null);renderTeam()};
    const sl=$('#tmLink');if(sl)sl.onclick=async()=>{const u=setupLink();try{if(navigator.share)await navigator.share({title:'Start/Sit setup',url:u});else{await navigator.clipboard.writeText(u);sl.textContent='Copied. Open it on your phone'}}catch(e){prompt('Copy this link and open it on your phone:',u)}};
    const rm=$('#tmForget');if(rm)rm.onclick=()=>{AUTH=null;store.set('ss_espn_auth',null);tmMenu=false;renderTeam()}}
}
function doMove(m){const a=m.act;
  if(a.type==='cmp'){picks=a.ids.filter(Boolean);save();goCmp('week')}
  else if(a.type==='wv'){wv={drop:a.drop,add:a.add};store.set('ss_wv',wv);goCmp('waiver')}
  else if(a.type==='add'){if(byId[a.id]){picks=[a.id];save();goCmp('week')}}
  else if(a.type==='trade'){tr={give:[a.a],get:[a.b]};store.set('ss_tr',tr);goCmp('trade')}
  else if(a.type==='lineup'){$('#s-team .lu')&&$('#s-team .lu').scrollIntoView({behavior:'smooth',block:'start'})}
  else if(a.type==='open'){if(byId[a.id]){picks=[a.id];save();goCmp('week')}}}

/* ---------- boot ---------- */
setW();header();
$$('.tabbar button').forEach(b=>b.setAttribute('aria-selected',b.dataset.tab===tab));
['team','ss','rank','def','how'].forEach(id=>$('#s-'+id).hidden=id!==tab);
if(readSetup()){$$('.tabbar button').forEach(b=>b.setAttribute('aria-selected',b.dataset.tab===tab));['team','ss','rank','def','how'].forEach(id=>$('#s-'+id).hidden=id!==tab)}
render(tab);
if(LG&&LG.id&&!LG.data)connectLeague(LG.id).then(()=>{if(LG&&LG.data&&LG.team!=null)renderTeam()});else refreshLeague(false);
/* an open tab (phones restore them without reloading) checks for a newer version and reloads itself */
function checkFresh(){const me=(document.querySelector('meta[name=build]')||{}).content;if(!me)return;
  fetch('hash.txt?'+Date.now(),{cache:'no-store'}).then(r=>r.ok?r.text():'').then(x=>{x=(x||'').trim();
    if(!x||x===me)return;let tried={};try{tried=JSON.parse(sessionStorage.getItem('ss_reload')||'{}')}catch(e){}
    if(tried[x])return;tried[x]=1;try{sessionStorage.setItem('ss_reload',JSON.stringify(tried))}catch(e){}
    location.reload()}).catch(()=>{})}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')checkFresh()});
setInterval(()=>{if(document.visibilityState==='visible')checkFresh()},5*60e3);
setTimeout(checkFresh,3000);
addEventListener('hashchange',()=>{if(readSetup()){go('team');if(LG&&LG.id)connectLeague(LG.id)}});
</script>
