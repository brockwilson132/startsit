<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Start/Sit</title>
<meta name="description" content="Fantasy football start/sit, waivers and rankings, updated every hour.">
<meta name="theme-color" content="#F2F3EE" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0B1220" media="(prefers-color-scheme: dark)">
<link rel="preload" href="fonts/bsd-800.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/barlow-500.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:"Big Shoulders Display";src:url(fonts/bsd-700.woff2) format("woff2");font-weight:700;font-display:swap}
@font-face{font-family:"Big Shoulders Display";src:url(fonts/bsd-800.woff2) format("woff2");font-weight:800;font-display:swap}
@font-face{font-family:"Big Shoulders Display";src:url(fonts/bsd-900.woff2) format("woff2");font-weight:900;font-display:swap}
@font-face{font-family:Barlow;src:url(fonts/barlow-400.woff2) format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:Barlow;src:url(fonts/barlow-500.woff2) format("woff2");font-weight:500;font-display:swap}
@font-face{font-family:Barlow;src:url(fonts/barlow-600.woff2) format("woff2");font-weight:600;font-display:swap}
@font-face{font-family:Barlow;src:url(fonts/barlow-700.woff2) format("woff2");font-weight:700;font-display:swap}

/* ---------- tokens ---------- */
:root{
  --bg:#F2F3EE; --surface:#FFFFFF; --surface-2:#F7F8F4; --ink:#14213D; --ink-2:#2E3B57; --muted:#5E6779; --faint:#8A92A0;
  --line:#E2E5DC; --line-2:#D3D8CC;
  --turf:#1E6B45; --turf-2:#195C3B; --turf-hi:#2A8456; --chalk:#F4F7F2; --chalk-dim:rgba(244,247,242,.62); --chalk-line:rgba(244,247,242,.22);
  --yellow:#F2C21B; --yellow-ink:#2B2200;
  --up:#1E7A4C; --up-bg:#E3F1E8; --down:#B8402D; --down-bg:#F8E5E1; --warn-bg:#FBF1CF; --warn-ink:#5E4700;
  --s-model:#1baf7a; --s-exp:#2a78d6; --s-veg:#eb6834; --s-app:#6250d6;
  --display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --body:Barlow,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r-sm:8px; --r:14px; --r-lg:20px;
  --top:env(safe-area-inset-top,0px); --bot:env(safe-area-inset-bottom,0px);
  --shadow:0 1px 0 rgba(20,33,61,.04),0 8px 24px -12px rgba(20,33,61,.18);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0B1220; --surface:#121C2E; --surface-2:#172338; --ink:#E9EEF6; --ink-2:#C9D2E1; --muted:#9AA6B8; --faint:#6F7C91;
  --line:#22304A; --line-2:#2C3B57;
  --turf:#17603D; --turf-2:#124F32; --turf-hi:#22804F;
  --yellow:#F5CC2E; --up:#4CC38A; --up-bg:#123326; --down:#F07A64; --down-bg:#3A1C19; --warn-bg:#3A3112; --warn-ink:#F5DB8A;
  --s-model:#199e70; --s-exp:#3987e5; --s-veg:#d95926; --s-app:#9085e9;
  --shadow:0 1px 0 rgba(0,0,0,.2),0 10px 28px -14px rgba(0,0,0,.6); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0B1220; --surface:#121C2E; --surface-2:#172338; --ink:#E9EEF6; --ink-2:#C9D2E1; --muted:#9AA6B8; --faint:#6F7C91;
  --line:#22304A; --line-2:#2C3B57; --turf:#17603D; --turf-2:#124F32; --turf-hi:#22804F;
  --yellow:#F5CC2E; --up:#4CC38A; --up-bg:#123326; --down:#F07A64; --down-bg:#3A1C19; --warn-bg:#3A3112; --warn-ink:#F5DB8A;
  --s-model:#199e70; --s-exp:#3987e5; --s-veg:#d95926; --s-app:#9085e9;
  --shadow:0 1px 0 rgba(0,0,0,.2),0 10px 28px -14px rgba(0,0,0,.6); color-scheme:dark }

/* ---------- base ---------- */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-padding-top:calc(72px + var(--top))}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.45 var(--body);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;-webkit-user-select:none;user-select:none}
:focus-visible{outline:3px solid var(--yellow);outline-offset:2px;border-radius:6px}
[hidden]{display:none!important}
.num,.disp{font-family:var(--display);font-variant-numeric:tabular-nums;letter-spacing:.01em}
h1,h2,h3{margin:0}
p{margin:0}
small{font-size:13px}
.muted{color:var(--muted)}

/* ---------- app shell ---------- */
.topbar{position:sticky;top:0;z-index:30;padding:calc(10px + var(--top)) 16px 10px;display:flex;align-items:center;gap:12px;
  background:color-mix(in srgb,var(--bg) 88%,transparent);-webkit-backdrop-filter:saturate(1.4) blur(14px);backdrop-filter:saturate(1.4) blur(14px);border-bottom:1px solid transparent;transition:border-color .2s}
.topbar.scrolled{border-bottom-color:var(--line)}
.brand{display:flex;flex-direction:column;min-width:0;flex:1}
.wordmark{font:900 25px/0.9 var(--display);letter-spacing:.02em;text-transform:uppercase;color:var(--ink)}
.stamp{font-size:12.5px;color:var(--muted);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fmt{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px;box-shadow:var(--shadow)}
.fmt button{border:0;background:none;min-width:44px;height:32px;padding:0 10px;border-radius:999px;font:800 15px var(--display);letter-spacing:.03em;color:var(--muted)}
.fmt button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

main{max-width:600px;margin:0 auto;padding:4px 16px calc(96px + var(--bot))}
.screen{animation:none}

.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:40;background:color-mix(in srgb,var(--surface) 94%,transparent);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);
  border-top:1px solid var(--line);padding:0 4px var(--bot);display:grid;grid-template-columns:repeat(6,1fr)}
.tabbar button{position:relative;border:0;background:none;height:62px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--faint);font:600 11.5px var(--body)}
.tabbar svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tabbar button[aria-selected="true"]{color:var(--ink)}
.tabbar button[aria-selected="true"]::before{content:"";position:absolute;top:-1px;left:22%;right:22%;height:3px;border-radius:0 0 3px 3px;background:var(--yellow)}

/* ---------- shared pieces ---------- */
.h2{font:800 30px/1 var(--display);letter-spacing:.01em}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:28px 0 10px}
.sec-h h3{font:800 22px/1 var(--display)}
.sec-h small{color:var(--muted)}
.cap{font-size:13.5px;color:var(--muted);line-height:1.45}
.seg{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:3px;gap:2px}
.seg button{flex:1;border:0;background:none;height:38px;border-radius:9px;font:600 15px var(--body);color:var(--muted);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:12px -16px 4px;padding:2px 16px 4px;scroll-padding-inline:16px;scroll-snap-type:x proximity}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:0 0 auto;border:1px solid var(--line-2);background:var(--surface);height:36px;padding:0 14px;border-radius:999px;font:800 15px var(--display);letter-spacing:.04em;color:var(--ink-2);scroll-snap-align:start}
.chips button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.badge{display:inline-flex;align-items:center;justify-content:center;height:20px;min-width:34px;padding:0 6px;border-radius:5px;font:800 12.5px/1 var(--display);letter-spacing:.06em;color:#fff;background:var(--tc,#6B7280);box-shadow:inset 0 0 0 1px rgba(255,255,255,.14)}
.badge.lt{color:#1b1b1b}
.pos{font:700 12.5px var(--body);color:var(--muted);letter-spacing:.02em}
.tag{display:inline-flex;align-items:center;gap:4px;height:20px;padding:0 7px;border-radius:5px;font:700 11.5px var(--body);letter-spacing:.02em;vertical-align:2px}
.tag.out{background:var(--down);color:#fff}.tag.bad{background:var(--down-bg);color:var(--down)}.tag.warn{background:var(--warn-bg);color:var(--warn-ink)}
.tag.ok{background:var(--up-bg);color:var(--up)}.tag.plain{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.btn{border:0;height:44px;padding:0 16px;border-radius:12px;background:var(--ink);color:var(--bg);font:700 15px var(--body)}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line-2)}
.linkish{border:0;background:none;padding:0;color:var(--turf-hi);font-weight:600;text-decoration:underline;text-underline-offset:3px}
.empty{border:1.5px dashed var(--line-2);border-radius:var(--r);padding:22px 18px;text-align:center;color:var(--muted);font-size:15px}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}

/* ---------- head-to-head slots ---------- */
.slots{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}
.slot{position:relative;min-height:132px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);padding:14px 12px 12px;overflow:hidden;display:flex;flex-direction:column;text-align:left}
.slot::before{content:"";position:absolute;left:0;right:0;top:0;height:4px;background:var(--tc,var(--line-2))}
.slot .who{display:flex;align-items:center;gap:6px;margin-bottom:6px}
.slot .nm{font:800 21px/1.02 var(--display);letter-spacing:.005em;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.slot .meta{font-size:13px;color:var(--muted);margin-top:4px}
.slot .big{margin-top:auto;padding-top:8px;display:flex;align-items:baseline;gap:6px}
.slot .big b{font:900 40px/0.9 var(--display);font-variant-numeric:tabular-nums}
.slot .big small{color:var(--muted);font-size:12.5px}
.slot.lead{border-color:var(--yellow);box-shadow:0 0 0 1.5px var(--yellow),var(--shadow)}
.slot .pick{position:absolute;right:10px;top:12px;background:var(--yellow);color:var(--yellow-ink);font:800 13px/1 var(--display);letter-spacing:.06em;padding:5px 7px;border-radius:6px}
.slot .x{position:absolute;right:4px;bottom:4px;width:36px;height:36px;border:0;border-radius:10px;background:none;color:var(--faint);font-size:18px;line-height:1}
.slot.add.slim{grid-column:1/-1;min-height:52px;flex-direction:row;padding:0 14px}
.slot.add.slim .plus{width:30px;height:30px;font-size:20px}
.slot.add{align-items:center;justify-content:center;border:1.5px dashed var(--line-2);box-shadow:none;background:transparent;color:var(--muted);gap:6px;font-weight:600}
.slot.add::before{display:none}
.slot.add .plus{width:40px;height:40px;border-radius:50%;background:var(--surface);border:1px solid var(--line-2);display:grid;place-items:center;font:700 24px/1 var(--body);color:var(--ink)}
.slot .role{font:700 12px var(--body);letter-spacing:.04em;color:var(--muted);margin-bottom:6px}
.slot.drop::before{background:var(--muted)} .slot.addp::before{background:var(--turf-hi)}

/* ---------- baseball cards ---------- */
.ic{width:16px;height:16px;flex:0 0 auto;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.cards2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}
.bcw{perspective:1200px;min-width:0}
.bc{display:grid;transition:transform .55s cubic-bezier(.3,.8,.25,1);transform-style:preserve-3d;height:100%}
.bc.flip{transform:rotateY(180deg)}
.bc-face{grid-area:1/1;-webkit-backface-visibility:hidden;backface-visibility:hidden;border-radius:16px;overflow:hidden;background:var(--surface);
  border:1px solid var(--line);box-shadow:var(--shadow);display:flex;flex-direction:column;min-width:0}
.bc-face.back{transform:rotateY(180deg)}
.bcw.lead .bc-face{border-color:var(--yellow);box-shadow:0 0 0 2px var(--yellow),var(--shadow)}
.bc-photo{position:relative;height:92px;background:var(--tc,#6B7280);background-image:linear-gradient(160deg,rgba(255,255,255,.18),rgba(255,255,255,0) 45%,rgba(0,0,0,.28));overflow:hidden;color:#fff}
.bc-photo::before{content:"";position:absolute;left:-30%;right:-30%;bottom:16px;height:16px;background:linear-gradient(var(--tc2) 0 5px,transparent 5px 11px,var(--tc2) 11px 16px);transform:rotate(-8deg);opacity:.85;pointer-events:none}
.bc-photo .crest{filter:drop-shadow(0 1px 1px rgba(0,0,0,.35))}
.crest{flex:none;display:block}
/* my team */
.connect{margin-top:14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:22px 18px;text-align:center}
.connect .cn-ic{width:52px;height:52px;margin:0 auto 10px;border-radius:50%;display:grid;place-items:center;background:var(--up-bg);color:var(--up)}
.connect .cn-ic .ic{width:26px;height:26px}
.connect b{font:800 22px var(--display);display:block}
.connect p{color:var(--muted);font-size:14px;margin:6px 0 14px}
.connect form{display:flex;gap:8px}
.connect input{flex:1;min-width:0;height:46px;border-radius:12px;border:1px solid var(--line-2);background:var(--bg);color:var(--ink);padding:0 12px;font:500 15px var(--body)}
.connect .err{color:var(--down);margin-top:10px}
.tm-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-top:10px}
.tm-head .h2{margin:0}
.iconbtn{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);display:grid;place-items:center;flex:none}
.moves{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.mv{display:grid;grid-template-columns:38px 1fr 18px;gap:10px;align-items:center;text-align:left;width:100%;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:11px 12px;box-shadow:var(--shadow);color:var(--ink)}
.mv>.ic{width:16px;height:16px;color:var(--faint)}
.mv-i{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:var(--surface-2)}
.mv-i .ic{width:20px;height:20px}
.mv.up .mv-i{background:var(--up-bg);color:var(--up)}.mv.bad .mv-i{background:var(--down-bg);color:var(--down)}.mv.warn .mv-i{background:var(--warn-bg);color:var(--warn-ink)}
.mv-t b{display:block;font:800 17px/1.15 var(--display);letter-spacing:.01em}
.mv-t small{display:block;color:var(--muted);font-size:13px;margin-top:2px;line-height:1.35}
.lu{margin-top:8px}
.lu-row{display:grid;grid-template-columns:44px minmax(0,1fr) 54px;gap:8px;align-items:center;padding:9px 12px 9px 10px;border-top:1px solid var(--line);cursor:pointer}
.lu-row:first-child{border-top:0}
.lu-s{font:800 13px var(--display);letter-spacing:.06em;color:var(--muted);background:var(--surface-2);border-radius:7px;text-align:center;padding:5px 0}
.lu-p{display:flex;align-items:center;gap:9px;min-width:0}
.lu-p b{display:block;font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lu-p small{display:block;color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lu-p small em{font-style:normal;color:var(--up);font-weight:600}
.lu-v{text-align:right;font:800 18px var(--display);font-variant-numeric:tabular-nums;display:flex;align-items:center;justify-content:flex-end;gap:4px}
.lu-v .ic{width:13px;height:13px;color:var(--faint)}
.lu-row.moved{background:color-mix(in srgb,var(--up-bg) 60%,transparent)}
.lu-row.moved .lu-s{background:var(--up);color:#fff}
.lu-row.bench .lu-v{color:var(--muted);font-size:16px}
.tm-pick{width:100%;text-align:left;border:0;border-top:1px solid var(--line);grid-template-columns:44px 0 1fr 20px!important}
.tm-pick .ic{width:16px;height:16px;color:var(--faint)}
.wx{display:inline-flex;align-items:center;gap:3px;margin-top:3px;font-size:12px;color:var(--muted);white-space:nowrap}
.wx .ic{width:13px;height:13px}
.wx.bad{color:var(--warn-ink,#9a6700)}
.crest.logo{object-fit:contain;border-radius:50%;background:#fff;padding:2px;box-shadow:0 0 0 1px rgba(0,0,0,.08)}
.bc-photo .crest.logo{box-shadow:0 1px 3px rgba(0,0,0,.35)}
.li .crest{justify-self:center}
/* lead card: a slow foil sheen, like a parallel insert */
.bcw.lead .bc-photo::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.28) 45%,rgba(255,236,150,.22) 50%,transparent 62%);background-size:250% 100%;animation:foil 4.5s ease-in-out infinite;pointer-events:none;mix-blend-mode:screen}
@keyframes foil{0%{background-position:120% 0}60%,100%{background-position:-60% 0}}
@media (prefers-reduced-motion:reduce){.bcw.lead .bc-photo::after{animation:none;display:none}}
.bc-photo.lt{color:#1b1b1b}
.bc-num{position:absolute;right:-6px;bottom:-26px;font:900 112px/1 var(--display);letter-spacing:-.04em;opacity:.26;font-variant-numeric:tabular-nums;pointer-events:none}
.bc-top{position:absolute;left:10px;top:10px;right:8px;display:flex;align-items:center;gap:6px}
.bc-top .tm{font:900 15px/1 var(--display);letter-spacing:.06em}
.bc-top .ps{font:800 12px/1 var(--display);letter-spacing:.06em;padding:3px 5px;border-radius:4px;background:rgba(255,255,255,.22)}
.bc-photo.lt .ps{background:rgba(0,0,0,.12)}
.bc-top .sp{flex:1}
.bc-rm{width:30px;height:30px;border-radius:50%;border:0;background:rgba(0,0,0,.28);color:#fff;display:grid;place-items:center;margin:-4px -2px 0 0}
.bc-rm .ic{width:14px;height:14px;stroke-width:2.4}
.bc-flag{position:absolute;left:10px;bottom:9px;display:flex;align-items:center;gap:4px;height:22px;padding:0 7px 0 5px;border-radius:6px;font:800 12px/1 var(--display);letter-spacing:.05em}
.bc-flag .ic{width:13px;height:13px;stroke-width:2.6}
.bc-flag.out,.bc-flag.bad{background:var(--down);color:#fff}.bc-flag.warn{background:var(--yellow);color:var(--yellow-ink)}
.bc-ribbon{position:absolute;right:0;bottom:10px;background:var(--yellow);color:var(--yellow-ink);font:900 14px/1 var(--display);letter-spacing:.08em;padding:5px 10px 5px 9px;border-radius:6px 0 0 6px;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.bc-ribbon.drop{background:var(--surface);color:var(--ink)}.bc-ribbon.add{background:var(--turf-hi);color:#fff}
.bc-plate{padding:10px 12px 0}
.bc-plate .nm{font:800 20px/1.02 var(--display);letter-spacing:.005em;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:40px}
.bc-plate .when{display:flex;align-items:center;gap:4px;font-size:12.5px;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden}
.bc-plate .when .ic{width:13px;height:13px}
.bc-proj{display:flex;align-items:flex-end;gap:7px;padding:8px 12px 10px;border-bottom:1px solid var(--line)}
.bc-proj b{font:900 40px/.82 var(--display);font-variant-numeric:tabular-nums}
.bc-proj span{font-size:11.5px;line-height:1.15;color:var(--muted);padding-bottom:1px}
.bc-proj span em{font-style:normal;font-weight:700;color:var(--ink-2)}
.bc-stats{display:grid;grid-template-columns:1fr 1fr;flex:1}
.bc-stat{display:flex;flex-direction:column;gap:1px;padding:8px 10px 8px 12px;border-bottom:1px solid var(--line);min-width:0}
.bc-stat:nth-child(odd){border-right:1px solid var(--line)}
.bc-stat .v{display:flex;align-items:center;gap:5px;font:800 19px/1 var(--display);font-variant-numeric:tabular-nums;color:var(--ink)}
.bc-stat .v .ic{color:var(--faint)}
.bc-stat .l{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bc-stat.good .v{color:var(--up)}.bc-stat.bad .v{color:var(--down)}
.bc-stat .tr{font-size:11px;margin-left:1px}.bc-stat .tr.up{color:var(--up)}.bc-stat .tr.dn{color:var(--down)}
.bc-foot{display:flex;align-items:center;gap:10px;padding:8px 6px 8px 12px;font:800 14px var(--display);color:var(--ink-2);letter-spacing:.02em}
.bc-foot span{display:flex;align-items:center;gap:4px}
.bc-foot .ic{color:var(--faint)}
.bc-foot .ex.far{color:var(--down)}
.bc-fl{margin-left:auto;width:34px;height:30px;border:0;border-radius:8px;background:var(--surface-2);color:var(--muted);display:grid;place-items:center}
.bc-fl .ic{width:17px;height:17px}
/* back */
.bc-face.back{padding:12px 12px 8px}
.bc-bh{display:flex;align-items:center;gap:6px;margin-bottom:8px}
.bc-bh .nm{flex:1;font:800 16px/1.05 var(--display);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bk-sec{font:700 11px var(--body);color:var(--muted);margin:8px 0 4px;display:flex;align-items:center;gap:4px}
.bk-sec .ic{width:13px;height:13px}
.bk-row{display:grid;grid-template-columns:52px 1fr 34px;gap:6px;align-items:center;font-size:12px;margin:5px 0}
.bk-row .l{color:var(--muted)}.bk-row .v{text-align:right;font:800 15px var(--display);font-variant-numeric:tabular-nums}
.bk-tr{position:relative;height:7px;border-radius:4px;background:var(--surface-2);border:1px solid var(--line)}
.bk-tr .f{position:absolute;top:-1px;bottom:-1px;border-radius:4px;background:var(--ink)}
.bk-tr.c::before{content:"";position:absolute;left:50%;top:-3px;bottom:-3px;width:1.5px;background:var(--faint)}
.bk-tr .f.p{background:var(--up)}.bk-tr .f.n{background:var(--down)}
.bk-wk{display:flex;gap:3px;align-items:flex-end;height:58px}
.bk-wk .c{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;min-width:0}
.bk-wk .b{width:100%;border-radius:3px 3px 1px 1px;background:var(--turf-hi)}
.bk-wk .b.fut{background:repeating-linear-gradient(135deg,var(--turf-hi) 0 3px,transparent 3px 5px);border:1px solid var(--turf-hi)}
.bk-wk .v{font:800 10.5px var(--display);color:var(--muted);margin-bottom:2px}
.bk-wk .w{font:700 9.5px var(--display);color:var(--faint);margin-top:2px}
.bk-facts{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:12px;color:var(--muted);margin-top:6px}
.bk-facts b{color:var(--ink);font-weight:700}
.bc-face.back .bc-fl{margin:auto 0 0 auto}
.cards2 .addcard{min-height:120px;border-radius:16px;border:1.5px dashed var(--line-2);background:transparent;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;font-weight:600}
.cards2 .addcard .plus{width:42px;height:42px;border-radius:50%;background:var(--surface);border:1px solid var(--line-2);display:grid;place-items:center;color:var(--ink)}
.cards2 .addcard.slim{grid-column:1/-1;min-height:50px;flex-direction:row}
.cards2 .addcard.slim .plus{width:30px;height:30px}
/* alerts under the cards: injury reports and news, full length */
.alerts{display:grid;gap:8px;margin-top:12px}
.alert{display:grid;grid-template-columns:30px 1fr;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:14px;line-height:1.45}
.alert .ai{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:var(--surface-2);color:var(--muted)}
.alert .ai .ic{width:17px;height:17px}
.alert.out .ai,.alert.bad .ai{background:var(--down-bg);color:var(--down)}.alert.warn .ai{background:var(--warn-bg);color:var(--warn-ink)}
.alert.vac .ai{background:var(--up-bg);color:var(--up)}
.alert b{font-weight:700}
.alert small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
/* legend chips inside the field */
.legend-i{position:relative;z-index:1;display:flex;gap:14px;padding:0 18px 14px;font-size:12px;color:var(--chalk-dim)}
.legend-i span{display:flex;align-items:center;gap:6px}
.legend-i i{display:inline-block}
.lg-dot{width:10px;height:10px;border-radius:50%;background:var(--chalk)}
.lg-rng{width:18px;height:6px;border-radius:3px;background:rgba(244,247,242,.3)}
.lg-fd{width:3px;height:12px;background:var(--yellow);border-radius:1px}
/* ---------- the field (verdict panel) ---------- */
.field{position:relative;margin-top:14px;border-radius:var(--r-lg);color:var(--chalk);overflow:hidden;
  background:linear-gradient(180deg,var(--turf-hi) -40%,var(--turf) 45%,var(--turf-2) 100%);box-shadow:0 18px 40px -22px rgba(13,60,35,.75)}
.field::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(90deg,transparent 0 calc(10% - 1px),rgba(255,255,255,.035) calc(10% - 1px) 10%)}
.field .v-top{position:relative;z-index:1;padding:18px 18px 4px}
.field .kicker{font:600 13px var(--body);color:var(--chalk-dim)}
.field h2{font:900 38px/0.95 var(--display);letter-spacing:.005em;margin-top:6px;text-wrap:balance}
.field .why{margin-top:10px;font-size:14.5px;line-height:1.45;color:var(--chalk-dim);max-width:52ch}
.field .why b{color:var(--chalk);font-weight:600}
.odds{display:flex;align-items:center;gap:12px;margin-top:14px}
.odds .pct{font:900 44px/0.85 var(--display);font-variant-numeric:tabular-nums;color:var(--yellow)}
.odds .pct small{font-size:22px}
.odds .lbl{font-size:13.5px;line-height:1.3;color:var(--chalk-dim)}
.tug{position:relative;height:10px;border-radius:5px;background:rgba(255,255,255,.18);margin-top:12px;overflow:hidden}
.tug i{position:absolute;left:0;top:0;bottom:0;background:var(--yellow);border-radius:5px 0 0 5px;transition:width .5s cubic-bezier(.2,.8,.2,1)}
.tug-l{display:flex;justify-content:space-between;font:700 13px var(--body);margin-top:6px;color:var(--chalk-dim)}
.yard{position:relative;z-index:1;margin:16px 0 0;padding:34px 0 12px;border-top:1px solid var(--chalk-line);background:rgba(0,0,0,.08)}
.yard .yl{position:absolute;top:24px;bottom:0;width:1px;background:var(--chalk-line)}
.yard .yl.mj{background:rgba(244,247,242,.42);width:2px;margin-left:-1px}
.yard .yn{position:absolute;top:6px;transform:translateX(-50%);font:800 13px var(--display);color:var(--chalk-dim);letter-spacing:.04em}
.yard .fd{position:absolute;top:24px;bottom:0;z-index:1;width:3px;margin-left:-1.5px;background:var(--yellow);box-shadow:0 0 12px rgba(242,194,27,.55);transition:left .6s cubic-bezier(.2,.8,.2,1)}
.lane{position:relative;height:52px;z-index:2}
.lane .rng{position:absolute;top:24px;height:10px;border-radius:5px;background:rgba(244,247,242,.2)}
.lane .dot{position:absolute;top:18px;width:22px;height:22px;margin-left:-11px;border-radius:50%;background:var(--chalk);border:3px solid var(--turf-2);transition:left .6s cubic-bezier(.2,.8,.2,1)}
.lane.lead .dot{background:var(--yellow);border-color:#fff}
.lane .lb{position:absolute;top:-2px;padding:3px 6px 2px;border-radius:5px;background:rgba(9,40,24,.62);font:800 15px/1 var(--display);letter-spacing:.02em;white-space:nowrap;transform:translateX(-50%)}
.lane .lb.l{transform:none}.lane .lb.r{transform:translateX(-100%)}
.yard-cap{position:relative;z-index:1;padding:0 18px 16px;font-size:12.5px;color:var(--chalk-dim)}

/* ---------- accordion player cards ---------- */
.pcards{margin-top:18px;display:grid;gap:10px}
details.pc{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
details.pc>summary{list-style:none;display:grid;grid-template-columns:5px 1fr auto 18px;gap:12px;align-items:center;padding:12px 14px 12px 0;cursor:pointer;min-height:64px}
details.pc>summary::-webkit-details-marker{display:none}
details.pc>summary .strip{align-self:stretch;background:var(--tc,var(--line-2));border-radius:0 3px 3px 0;margin:-12px 0}
.pc .t1{font:800 19px/1.05 var(--display);letter-spacing:.005em}
.pc .t2{font-size:13px;color:var(--muted);margin-top:3px;display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.pc .val{text-align:right}
.pc .val b{display:block;font:900 30px/0.9 var(--display);font-variant-numeric:tabular-nums}
.pc .val small{color:var(--muted);font-size:12px}
.pc .chev{width:18px;height:18px;color:var(--faint);transition:transform .2s}
details.pc[open] .chev{transform:rotate(180deg)}
.pc .body{padding:2px 16px 16px;border-top:1px solid var(--line)}
.flag{display:flex;gap:10px;align-items:flex-start;border-radius:10px;padding:10px 12px;margin-top:12px;font-size:14px;line-height:1.4}
.flag b{flex:0 0 auto;font:800 12.5px/1.5 var(--display);letter-spacing:.06em}
.flag.out{background:var(--down-bg);color:var(--down)}.flag.out span{color:var(--ink)}
.flag.bad{background:var(--down-bg);color:var(--down)}.flag.bad span{color:var(--ink)}
.flag.warn{background:var(--warn-bg);color:var(--warn-ink)}.flag.warn span{color:var(--ink)}
.flag.final{background:var(--surface-2);color:var(--ink)}
.news{margin-top:12px;padding-left:12px;border-left:3px solid var(--line-2);font-size:14px;line-height:1.45;color:var(--ink-2)}
.news b{display:block;font:700 12px var(--body);color:var(--muted);margin-bottom:2px}
.brk{margin-top:14px;display:grid;gap:9px}
.brk .r{display:grid;grid-template-columns:96px 1fr 50px;gap:10px;align-items:center;font-size:14px}
.brk .r .l{color:var(--muted)}
.brk .r .v{text-align:right;font:800 18px var(--display);font-variant-numeric:tabular-nums}
.brk .tr{position:relative;height:8px;border-radius:4px;background:var(--surface-2);border:1px solid var(--line)}
.brk .tr .f{position:absolute;top:-1px;bottom:-1px;border-radius:4px;background:var(--ink)}
.brk .tr.c::before{content:"";position:absolute;left:50%;top:-4px;bottom:-4px;width:1.5px;background:var(--faint)}
.brk .tr .f.p{background:var(--up)}.brk .tr .f.n{background:var(--down)}
.brk .note{font-size:13px;color:var(--muted);margin:-3px 0 2px 106px}
.brk .note .vac{display:block;color:var(--up);font-weight:600}
.brk .sep{height:1px;background:var(--line);margin:4px 0}
.facts{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.facts span{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:5px 9px;font-size:13px;color:var(--muted)}
.facts b{color:var(--ink);font-weight:700}
.facts .up{color:var(--up);font-weight:700}.facts .dn{color:var(--down);font-weight:700}
.vsx{margin-top:14px;display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;font-size:13.5px}
.vsx .rail{position:relative;height:2px;background:var(--line-2)}
.vsx .rail i{position:absolute;top:-5px;width:12px;height:12px;margin-left:-6px;border-radius:50%}
.vsx .rail .m{background:var(--turf-hi);z-index:1}.vsx .rail .e{background:var(--surface);border:2.5px solid var(--ink)}
.vsx b{font-weight:700}
.vsx-note{font-size:13px;color:var(--muted);margin-top:6px}

/* ---------- lists (rankings, waivers) ---------- */
.list{margin-top:10px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.li{display:grid;grid-template-columns:26px 24px 1fr auto;gap:10px;align-items:center;padding:11px 14px 11px 8px;border-top:1px solid var(--line);min-height:62px;cursor:pointer;background:var(--surface)}
.li:first-child{border-top:0}
.li.with-spark{grid-template-columns:26px 24px 1fr 64px auto}
.li .rk{font:800 18px var(--display);color:var(--faint);text-align:center;font-variant-numeric:tabular-nums}
.li .st{align-self:stretch;border-radius:2px;background:var(--tc,var(--line-2));margin:2px 0}
.li .nm{font:700 16px/1.15 var(--body);overflow:hidden;text-overflow:ellipsis}
.li .sub{font-size:12.5px;color:var(--muted);margin-top:2px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.li .rt{text-align:right;min-width:52px}
.li .rt b{display:block;font:900 24px/0.95 var(--display);font-variant-numeric:tabular-nums}
.li .rt small{font-size:11.5px;color:var(--muted)}
.li.open{background:var(--surface-2)}
.li .mu{font:800 12.5px var(--display);letter-spacing:.03em;padding:2px 6px;border-radius:4px}
.mu.good{background:var(--up-bg);color:var(--up)}.mu.bad{background:var(--down-bg);color:var(--down)}.mu.neu{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.li .add{width:40px;height:40px;border-radius:12px;border:1px solid var(--line-2);background:var(--surface);font:600 22px/1 var(--body);color:var(--ink)}
.li .add[aria-pressed="true"]{background:var(--turf);border-color:var(--turf);color:#fff}
.li.wv{grid-template-columns:26px 24px 1fr auto 40px}
.spark{display:block}.sp-bar{fill:var(--ink);opacity:.78}.sp-dnp{fill:var(--line-2)}.sp-bye{fill:var(--faint)}.sp-fut{fill:var(--turf-hi)}
.detail{background:var(--surface-2);border-top:1px solid var(--line);padding:14px 16px 16px;cursor:default}
.dt{display:grid;gap:12px;font-size:14.5px;line-height:1.45}
.dt .k{display:block;font:700 12px var(--body);color:var(--muted);margin-bottom:2px}
.dt .k + span b{font-weight:700}
.wkbars{display:flex;gap:5px;align-items:flex-end;height:96px;padding:4px 0 0}
.wkbars .c{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;min-width:0}
.wkbars .b{width:100%;max-width:28px;background:var(--turf-hi);border-radius:4px 4px 1px 1px}
.wkbars .b.hi{background:var(--yellow)}
.wkbars .v{font:800 12px var(--display);color:var(--muted);margin-bottom:3px}
.wkbars .w{font:700 11px var(--display);color:var(--faint);margin-top:4px;letter-spacing:.04em}
.dt-actions{display:flex;gap:8px;flex-wrap:wrap}
.bye-pills{display:flex;flex-wrap:wrap;gap:6px}
.bye-pills button{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;height:36px;padding:0 12px 0 6px;font:600 14px var(--body)}

/* ---------- waivers ---------- */
.gain{display:flex;align-items:baseline;gap:8px;margin-top:12px}
.gain b{font:900 52px/0.85 var(--display);color:var(--yellow);font-variant-numeric:tabular-nums}
.gain span{font-size:14px;color:var(--chalk-dim);line-height:1.3}
.wkchart{position:relative;z-index:1;margin:16px 0 0;padding:14px 12px 10px;border-top:1px solid var(--chalk-line);background:rgba(0,0,0,.08)}
.wkchart .bars{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:3px;height:96px;align-items:end}
.wkchart .wk{display:flex;flex-direction:column;height:100%;min-width:0}
.wkchart .pair{flex:1;display:flex;align-items:flex-end;gap:1.5px}
.wkchart .pair i{flex:1;border-radius:2px 2px 0 0}
.wkchart .pair .d{background:rgba(244,247,242,.38)}.wkchart .pair .a{background:var(--yellow)}
.wkchart .wl{text-align:center;font:800 11px var(--display);color:var(--chalk-dim);margin-top:4px;letter-spacing:.03em}
.wkchart .wl.bye{color:#ffb4a6}
.wklegend{display:flex;gap:14px;font-size:12.5px;color:var(--chalk-dim);margin-bottom:10px}
.wklegend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.notes{display:grid;gap:8px;margin-top:14px}
.notes .n{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px 10px 14px;font-size:14px;line-height:1.45;position:relative;overflow:hidden}
.notes .n::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--line-2)}
.notes .n.up::before{background:var(--up)}.notes .n.warn::before,.notes .n.dn::before{background:var(--yellow)}

/* ---------- search sheet ---------- */
.sheet-bg{position:fixed;inset:0;z-index:60;background:rgba(8,14,26,.42);opacity:0;transition:opacity .2s}
.sheet-bg.on{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:61;max-width:600px;margin:0 auto;background:var(--bg);border-radius:20px 20px 0 0;
  height:calc(100% - 56px - var(--top));display:flex;flex-direction:column;transform:translateY(100%);transition:transform .28s cubic-bezier(.2,.8,.2,1);box-shadow:0 -10px 40px rgba(0,0,0,.25)}
.sheet.on{transform:none}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:var(--line-2);margin:8px auto 4px}
.sheet .sh-top{display:flex;align-items:center;gap:10px;padding:8px 16px 10px}
.sheet .sh-top h3{flex:1;font:800 22px var(--display)}
.sheet .close{border:0;background:var(--surface);border:1px solid var(--line);width:36px;height:36px;border-radius:50%;font-size:16px}
.searchbox{margin:0 16px;position:relative}
.searchbox input{width:100%;height:50px;border-radius:14px;border:1.5px solid var(--line-2);background:var(--surface);padding:0 14px 0 44px;font-size:17px;outline:none}
.searchbox input:focus{border-color:var(--ink)}
.searchbox svg{position:absolute;left:14px;top:15px;width:20px;height:20px;stroke:var(--muted);fill:none;stroke-width:2}
.sh-list{flex:1;overflow-y:auto;padding:8px 16px calc(20px + var(--bot));-webkit-overflow-scrolling:touch}
.sh-list .grp{font:700 12px var(--body);color:var(--muted);margin:14px 4px 6px}
.res{display:grid;grid-template-columns:4px 1fr auto;gap:12px;align-items:center;width:100%;text-align:left;border:0;background:var(--surface);border-radius:12px;padding:10px 14px 10px 0;margin-bottom:6px;min-height:58px;border:1px solid var(--line)}
.res .st{align-self:stretch;background:var(--tc,var(--line-2));border-radius:0 3px 3px 0;margin:-10px 0}
.res .nm{font:700 16px var(--body)}
.res .sub{font-size:12.5px;color:var(--muted);margin-top:1px;display:flex;gap:6px;align-items:center}
.res b{font:900 22px var(--display);font-variant-numeric:tabular-nums}
.res.active{border-color:var(--ink)}

/* ---------- method & charts ---------- */
.subnav{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:8px -16px 18px;padding:2px 16px}
.subnav::-webkit-scrollbar{display:none}
.subnav button{flex:0 0 auto;border:1px solid var(--line-2);background:var(--surface);height:36px;padding:0 14px;border-radius:999px;font:600 14.5px var(--body);color:var(--ink-2)}
.subnav button[aria-selected="true"]{background:var(--turf);border-color:var(--turf);color:#fff}
.prose{font-size:16px;line-height:1.55}
.prose h2{font:900 32px/1 var(--display);margin:0 0 10px}
.prose p{margin:0 0 14px;max-width:62ch}
.prose .cap{font-size:14px}
.prose .h3,.h3{font:800 21px var(--display);margin:24px 0 8px}.h3 small{font:400 14px var(--body);color:var(--muted)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;margin:12px 0 14px}
.eq{font:800 22px/1.2 var(--display);letter-spacing:.01em}
.wf-row{display:grid;grid-template-columns:84px 1fr 54px;gap:10px;align-items:center}
.wf-l{font-size:14px;color:var(--muted)}.wf-v{text-align:right;font:800 19px var(--display)}
.wf-track{position:relative;height:22px}
.wf-bar{position:absolute;top:0;bottom:0;border-radius:5px;transition:left .4s,width .4s}
.wf-bar.b{background:var(--ink)}.wf-bar.p{background:var(--up)}.wf-bar.n{background:var(--down)}.wf-bar.t{background:var(--turf-hi);box-shadow:inset 0 0 0 2px var(--yellow)}
.wf-t{font-size:13px;color:var(--muted);margin:2px 0 12px 94px!important;line-height:1.4}
.wf-row.total{padding-top:12px;border-top:1px dashed var(--line-2)}.wf-row.total .wf-l{color:var(--ink);font-weight:700}
.sel select{display:block;width:100%;margin-top:6px;height:48px;padding:0 12px;border:1.5px solid var(--line-2);border-radius:12px;background:var(--surface);font-size:16px}
.sel{display:block;font-size:14px;color:var(--muted);margin:6px 0 14px}
.split{display:flex;height:48px;border-radius:12px;overflow:hidden;margin:8px 0 10px;font:800 17px var(--display);letter-spacing:.02em}
.split>div{display:flex;align-items:center;padding:0 14px;white-space:nowrap;transition:width .4s}
.split-u{background:var(--ink);color:var(--bg)}.split-p{flex:1;background:var(--surface);border:1px solid var(--line);justify-content:flex-end}
.demo-grid{display:grid;grid-template-columns:1fr 70px 90px;gap:8px 12px;font-size:15px;align-items:center}
.demo-grid .h{color:var(--muted);font-size:12.5px;text-align:right}
.demo-grid .val{font:800 20px var(--display);text-align:right}
.demo-grid small{display:block;color:var(--muted)}
.demo label{display:block;margin-top:14px;font-size:14px;color:var(--muted)}
.demo input[type=range]{width:100%;accent-color:var(--turf-hi);height:32px}
.verdict-demo{margin-top:6px;font-weight:700}
.dlist{list-style:none;padding:0;margin:0}
.dlist li{display:grid;grid-template-columns:22px 44px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line);font-size:14px}
.dlist li:first-child{border-top:0}
.dlist .rk2{color:var(--faint);font:800 16px var(--display)}.dlist .mv{color:var(--muted);font-size:12.5px}
.acc-row,.lv-row{display:grid;grid-template-columns:128px 1fr 62px;gap:10px;align-items:center;font-size:14px;padding:5px 0}
.acc-row b,.lv-row b{text-align:right;font:800 20px var(--display);font-variant-numeric:tabular-nums}
.acc-track,.lv-track{height:14px;background:var(--surface-2);border:1px solid var(--line);border-radius:4px;position:relative}
.acc-bar,.lv-bar{position:absolute;left:-1px;top:-1px;bottom:-1px;border-radius:4px;transition:width .4s}
.acc-bar.n{background:var(--faint)}.acc-bar.m{background:var(--turf-hi)}
.lv-bar{background:var(--c)}
.lv-row.lead .lv-l{font-weight:700}
.s-app{--c:var(--s-app)}.s-model{--c:var(--s-model)}.s-exp{--c:var(--s-exp)}.s-veg{--c:var(--s-veg)}
.sw{display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--c);margin-right:7px;vertical-align:-1px}
.lv-sum{font-weight:600;font-size:16px;margin:4px 0 4px}
.lv-chart{position:relative}
.lv-legend{display:flex;gap:14px;font-size:13px;color:var(--muted);padding:0 2px 6px}
.lv-chart svg{display:block;width:100%;height:auto;overflow:visible}
.lv-grid{stroke:var(--line);stroke-width:1}.lv-ax{fill:var(--muted);font:600 11px var(--body)}
.lv-line{fill:none;stroke:var(--c);stroke-width:2;stroke-linejoin:round}
.lv-dot{fill:var(--c);stroke:var(--surface);stroke-width:2}
.lv-dl{fill:var(--ink);font:700 12px var(--body)}
.lv-cross{stroke:var(--muted);stroke-width:1;stroke-dasharray:3 3}
.lv-hit{fill:transparent;cursor:pointer;outline:none}
.lv-tip{position:absolute;top:30px;width:156px;background:var(--ink);color:var(--bg);border-radius:10px;padding:9px 11px;font-size:13px;pointer-events:none;box-shadow:0 8px 22px rgba(0,0,0,.25)}
.lv-tip div{display:flex;align-items:center;margin-top:3px}.lv-tip span{margin-left:auto;font-weight:700}.lv-tip small{display:block;margin-top:4px;opacity:.75}
.lv-table{width:100%;border-collapse:collapse;margin:8px 0}
.lv-table th{font:600 12.5px var(--body);color:var(--muted);text-align:left;padding:8px 6px;border-bottom:1.5px solid var(--ink)}
.lv-table td{padding:9px 6px;border-bottom:1px solid var(--line);font-size:15px}
.lv-table .num{text-align:right;font:800 17px var(--display)}
.lv-table td.win{color:var(--turf-hi);text-decoration:underline;text-underline-offset:3px}
.pager{display:flex;justify-content:space-between;gap:10px;margin-top:24px;padding-top:16px;border-top:1px solid var(--line)}
.pager button{height:44px;padding:0 16px;border-radius:12px;border:1px solid var(--line-2);background:var(--surface);font:600 15px var(--body)}
.pager .next{background:var(--ink);color:var(--bg);border-color:var(--ink);margin-left:auto}
.dz-row{display:grid;grid-template-columns:18px 26px minmax(0,1fr) 72px 58px;gap:9px;align-items:center;padding:8px 12px 8px 8px;border-top:1px solid var(--line);font-size:14px}
.dz-row .rk{font:800 13px var(--display);color:var(--muted);text-align:right}
.dz-nm{display:flex;flex-direction:column;min-width:0}
.dz-nm b{font:800 16px/1.1 var(--display);letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dz-wk{display:inline-flex;align-items:center;gap:3px;font-size:12px;color:var(--muted);margin-top:2px;white-space:nowrap}
.dz-wk .ic{width:12px;height:12px}
.dz-row .v small{display:block;font:500 11px var(--body);color:var(--muted);letter-spacing:0;white-space:nowrap}
.dz-cap{margin-top:10px}
.hm{margin-top:10px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:6px 8px 8px}
.hm-h,.hm-r{display:grid;grid-template-columns:30px repeat(var(--n),1fr);gap:4px;align-items:center}
.hm-h{font:800 12px var(--display);color:var(--muted);letter-spacing:.06em;text-align:center;padding:4px 0 6px}
.hm-r{margin-top:4px}
.hm-c{height:30px;border-radius:7px;display:flex;align-items:center;justify-content:center;font:800 14px var(--display);letter-spacing:.04em;color:var(--ink);font-variant-numeric:tabular-nums}
.hm-c i{font-style:normal;font-weight:600;font-size:11px;opacity:.7;margin-right:1px}
.hm-c.now{box-shadow:inset 0 0 0 1.5px var(--ink-2)}
.hm-c.bye{background:repeating-linear-gradient(135deg,var(--surface-2) 0 5px,transparent 5px 10px);color:var(--muted);font-size:11px}
.hm-key{display:flex;align-items:center;gap:4px;justify-content:center;margin:10px 0 4px;font-size:12px;color:var(--muted)}
.hm-key i{width:22px;height:12px;border-radius:3px;display:inline-block}
.hm-key span{display:inline-flex;align-items:center;gap:3px;margin:0 4px}
.hm-key .ic,.dz-head .ic{width:13px;height:13px}
.dz-row:first-child{border-top:0}
.dz-row .axis{position:relative;height:14px}
.dz-row .axis::before{content:"";position:absolute;left:50%;top:-3px;bottom:-3px;width:1.5px;background:var(--line-2)}
.dz-row .bar{position:absolute;top:2px;height:10px;border-radius:3px}
.dz-row .v{text-align:right;font:800 16px var(--display);color:var(--ink-2);font-variant-numeric:tabular-nums}
.dz-head{display:grid;grid-template-columns:18px 26px minmax(0,1fr) 72px 58px;gap:9px;padding:0 12px 6px 8px;margin-top:12px;font-size:11.5px;color:var(--muted)}
.dz-head .ax{display:flex;justify-content:space-between;white-space:nowrap}
.dz-head .ax span{display:inline-flex;align-items:center;gap:2px}
footer{margin-top:36px;font-size:13px;line-height:1.5;color:var(--muted)}
footer .linkish{font-size:14px}

@media (min-width:700px){
  main{padding-top:12px}
  .slots{gap:14px}
  .field h2{font-size:46px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header class="topbar" id="topbar">
  <div class="brand">
    <span class="wordmark">Start/Sit</span>
    <span class="stamp" id="stamp"></span>
  </div>
  <div class="fmt" role="group" aria-label="Scoring format">
    <button data-s="proj" aria-pressed="true">PPR</button><button data-s="half" aria-pressed="false" aria-label="Half PPR">½</button><button data-s="std" aria-pressed="false" aria-label="Standard">Std</button>
  </div>
</header>

<main>
  <section id="s-team" class="screen" aria-label="My team" hidden></section>
  <section id="s-ss" class="screen" aria-label="Start or sit"></section>
  <section id="s-wv" class="screen" aria-label="Waivers" hidden></section>
  <section id="s-rank" class="screen" aria-label="Rankings" hidden></section>
  <section id="s-def" class="screen" aria-label="Matchups" hidden></section>
  <section id="s-how" class="screen" aria-label="Method" hidden><div class="prose" id="howOut"></div></section>
  <footer id="foot"></footer>
</main>

<nav class="tabbar" role="tablist" aria-label="Sections">
  <button role="tab" data-tab="team" aria-selected="false"><svg viewBox="0 0 24 24"><path d="M8.5 3.5 4 6v5h3v9.5h10V11h3V6l-4.5-2.5a3.5 3.5 0 0 1-7 0z"/></svg>Team</button>
  <button role="tab" data-tab="ss" aria-selected="true"><svg viewBox="0 0 24 24"><path d="M12 3.5v17M6.5 20.5h11M4 7.5h16"/><path d="M6.5 7.5L3.6 13.6a3 3 0 0 0 5.8 0L6.5 7.5zM17.5 7.5l-2.9 6.1a3 3 0 0 0 5.8 0l-2.9-6.1z"/></svg>Start/Sit</button>
  <button role="tab" data-tab="wv" aria-selected="false"><svg viewBox="0 0 24 24"><path d="M7.5 4L3.5 8l4 4M3.5 8H17M16.5 20l4-4-4-4M20.5 16H7"/></svg>Waivers</button>
  <button role="tab" data-tab="rank" aria-selected="false"><svg viewBox="0 0 24 24"><path d="M4 6h2.5M4 12h2.5M4 18h2.5M10 6h10M10 12h7M10 18h4"/></svg>Rankings</button>
  <button role="tab" data-tab="def" aria-selected="false"><svg viewBox="0 0 24 24"><path d="M12 3.2l7 2.8v6c0 4.4-2.9 7.6-7 8.8-4.1-1.2-7-4.4-7-8.8V6l7-2.8z"/><path d="M9 12.2l2 2 4-4.2"/></svg>Matchups</button>
  <button role="tab" data-tab="how" aria-selected="false"><svg viewBox="0 0 24 24"><path d="M4.5 17.5a7.5 7.5 0 1 1 15 0"/><path d="M12 17.5l3.6-5.2"/><circle cx="12" cy="17.5" r="1.3"/></svg>Method</button>
</nav>

<div class="sheet-bg" id="sheetBg" hidden></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" hidden>
  <div class="grab"></div>
  <div class="sh-top"><h3 id="sheetTitle">Add a player</h3><button class="close" id="sheetClose" aria-label="Close">✕</button></div>
  <div class="searchbox"><svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L20 20"/></svg>
    <input id="sq" type="search" placeholder="Search players or a team (KC)" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="search" aria-label="Search players"></div>
  <div class="sh-list" id="shList"></div>
</div>
<script>
let DATA={};
let P=DATA.players, M=DATA.meta, byId={};
function setData(D){DATA=D;P=D.players;M=D.meta;byId=Object.fromEntries(P.map(p=>[p.id,p]))}
setData(DATA);
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
let S=store.get('ss_scoring','proj'); if(!['proj','half','std'].includes(S))S='proj';
let tab=store.get('ss_tab',null); if(!['team','ss','wv','rank','def','how'].includes(tab))tab=(store.get('ss_league',null)||{}).team!=null?'team':'ss';

/* ---------- formatting & helpers ---------- */
const fmt=(n,d=1)=>(Math.round(n*10**d)/10**d).toFixed(d);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const scale=p=>p.proj>0?p[S]/p.proj:1;
const val=p=>p[S];
const sum=a=>a.reduce((s,x)=>s+(x||0),0);
const fmtTime=p=>{if(p.bye)return `bye in Week ${M.week}`;if(p.final)return 'final';if(!p.time)return '';const [h,m]=p.time.split(':').map(Number);const hh=((h+11)%12)+1;return `${p.day.slice(0,3)} ${hh}:${String(m).padStart(2,'0')}${h>=12?'p':'a'}`};
const vs=p=>p.bye||!p.opp?'':(p.home?'vs ':'@ ')+p.opp;
const actual=p=>p.act==null?null:(S==='std'?p.act_s:S==='half'?p.act_h:p.act);
const inactive=p=>['Out','IR','Exempt','Suspended','FA'].includes(p.status);
const live=p=>!p.bye&&!p.final&&!inactive(p);
const shortDate=s=>{if(!s)return '';const d=new Date(s+'T12:00:00');return d.toLocaleDateString('en-US',{month:'short',day:'numeric'})};
const compact=n=>n>=1e6?fmt(n/1e6,1)+'M':n>=1e3?Math.round(n/1e3)+'K':String(n);
const short=n=>n.endsWith(' D/ST')?n.slice(0,-5):(n.split(' ').slice(1).join(' ')||n);
function erf(x){const t=1/(1+.3275911*Math.abs(x));const y=1-(((((1.061405429*t-1.453152027)*t)+1.421413741)*t-.284496736)*t+.254829592)*t*Math.exp(-x*x);return x>=0?y:-y}
const Phi=z=>.5*(1+erf(z/Math.SQRT2));
const sd=p=>(p.hi-p.lo)*scale(p)/1.68;
const TEAM={ARI:'#97233F',ATL:'#A71930',BAL:'#241773',BUF:'#00338D',CAR:'#0085CA',CHI:'#0B162A',CIN:'#FB4F14',CLE:'#311D00',DAL:'#003594',DEN:'#FB4F14',DET:'#0076B6',GB:'#203731',HOU:'#03202F',IND:'#002C5F',JAX:'#006778',KC:'#E31837',LA:'#003594',LAC:'#0080C6',LV:'#1D1D1D',MIA:'#008E97',MIN:'#4F2683',NE:'#002244',NO:'#D3BC8D',NYG:'#0B2265',NYJ:'#125740',PHI:'#004C54',PIT:'#FFB612',SEA:'#002244',SF:'#AA0000',TB:'#D50A0A',TEN:'#0C2340',WAS:'#5A1414',FA:'#6B7280'};
const LIGHT=new Set(['NO','PIT']);
const TEAM2={ARI:'#FFB612',ATL:'#101820',BAL:'#9E7C0C',BUF:'#C60C30',CAR:'#101820',CHI:'#C83803',CIN:'#101820',CLE:'#FF3C00',DAL:'#869397',DEN:'#002244',DET:'#B0B7BC',GB:'#FFB612',HOU:'#A71930',IND:'#A2AAAD',JAX:'#D7A22A',KC:'#FFB81C',LA:'#FFA300',LAC:'#FFC20E',LV:'#A5ACAF',MIA:'#FC4C02',MIN:'#FFC62F',NE:'#C60C30',NO:'#101820',NYG:'#A71930',NYJ:'#FFFFFF',PHI:'#A5ACAF',PIT:'#101820',SEA:'#69BE28',SF:'#B3995D',TB:'#34302B',TEN:'#4B92DB',WAS:'#FFB612',FA:'#9CA3AF'};
/* an original shield in team colors (not a team logo): primary field, secondary rim and chevron, abbreviation */
/* team logo from ESPN's public image server (address list from nflverse); if it fails, the shield takes its place */
const logoSrc=t=>{const u=(DATA.logos||{})[t];return u?u.replace(/^https:\/\/a\.espncdn\.com(\/i\/teamlogos\/nfl\/500\/[a-z]+\.png)$/,'https://a.espncdn.com/combiner/i?img=$1&w=96&h=96'):null};
function logoFail(img){const t=img.dataset.t;if(img.dataset.raw!=='1'&&DATA.logos[t]){img.dataset.raw='1';img.src=DATA.logos[t];return}
  const s=document.createElement('span');s.innerHTML=shield(t,+img.dataset.sz);img.replaceWith(s.firstChild)}
const crest=(t,sz=26)=>{const u=logoSrc(t);return u?`<img class="crest logo" src="${u}" width="${sz}" height="${sz}" alt="${esc(t)}" loading="lazy" decoding="async" data-t="${esc(t)}" data-sz="${sz}" onerror="logoFail(this)">`:shield(t,sz)};
const shield=(t,sz=26)=>{const a=TEAM[t]||'#6B7280',b=TEAM2[t]||'#D1D5DB',ink=LIGHT.has(t)?'#141414':'#fff',s=String(t||'').slice(0,3),fs=s.length>2?13:15.5;
  return `<svg class="crest" width="${sz}" height="${Math.round(sz*1.12)}" viewBox="0 0 40 45" role="img" aria-label="${esc(s)}"><path d="M20 2 36.5 7.5v13.6C36.5 31.4 29.4 39 20 43 10.6 39 3.5 31.4 3.5 21.1V7.5z" fill="${a}" stroke="${b}" stroke-width="3" stroke-linejoin="round"/><path d="M9 31.5 20 26l11 5.5v3.4L20 29.4 9 34.9z" fill="${b}"/><text x="20" y="${s.length>2?22:22.5}" text-anchor="middle" dominant-baseline="middle" fill="${ink}" font-size="${fs}" font-weight="900" font-family="Big Shoulders Display,Barlow,sans-serif" letter-spacing=".5">${esc(s)}</text></svg>`};
const tc=t=>`--tc:${TEAM[t]||'#6B7280'};--tc2:${TEAM2[t]||'#D1D5DB'}`;
const badge=t=>`<span class="badge${LIGHT.has(t)?' lt':''}" style="${tc(t)}">${esc(t)}</span>`;
const chev=`<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>`;

function inj(p){
  if(p.status==='IR')return {lvl:'out',tag:'IR',txt:`On injured reserve${p.injury?' ('+p.injury+')':''}. ${p.ret?'Expected back around '+shortDate(p.ret)+'.':'Out for at least a few more weeks.'}`};
  if(p.status==='FA')return {lvl:'out',tag:'FREE AGENT',txt:`Not on an NFL team right now. He gets a projection as soon as he signs.`};
  if(p.status==='Suspended')return {lvl:'out',tag:'SUSPENDED',txt:`Suspended${p.ret?', expected back around '+shortDate(p.ret):''}.`};
  if(p.status==='Exempt')return {lvl:'out',tag:'NOT ACTIVE',txt:`On the league's exempt list. Counted out for 4 games; updates within the hour of his reinstatement.`};
  if(p.status==='Out')return {lvl:'out',tag:'OUT',txt:`Ruled out${p.injury?' ('+p.injury+')':''}. Don't start him.${p.ret?' Expected back around '+shortDate(p.ret)+'.':''}`};
  if(p.status==='Doubtful')return {lvl:'bad',tag:'DOUBTFUL',txt:`Doubtful${p.injury?' ('+p.injury+')':''}. Unlikely to play.`};
  const pr=(p.practice||'').startsWith('Did Not')?"didn't practice":(p.practice||'').startsWith('Limited')?'limited in practice':'';
  if(p.status==='Questionable')return {lvl:'warn',tag:'QUESTIONABLE',txt:`Questionable${p.injury?' ('+p.injury+')':''}${pr?', '+pr:''}. Check before kickoff.`};
  if(p.upd&&!/IR|Released|Suspended|exempt|Not on/.test(p.upd.what))return null;
  if(p.miss&&pr)return {lvl:'warn',tag:'INJURY',txt:`Missed last week and ${pr} this week. Check his status.`};
  if(p.miss)return {lvl:'warn',tag:'CHECK',txt:`Didn't play last week. Check his status.`};
  if(p.new)return {lvl:'warn',tag:'NO GAMES',txt:`Hasn't played yet this season. The projection leans on last season, so check his role.`};
  if(pr==="didn't practice")return {lvl:'warn',tag:'PRACTICE',txt:`Didn't practice this week. Could be rest or an injury.`};
  return null}
const SHORTTAG={OUT:'Out',IR:'IR','FREE AGENT':'FA',SUSPENDED:'Susp.','NOT ACTIVE':'Inactive',DOUBTFUL:'Doubtful',QUESTIONABLE:'Q',INJURY:'Injury',CHECK:'Check','NO GAMES':'New',PRACTICE:'DNP'};
const injTag=p=>{const i=p&&inj(p);return i?`<span class="tag ${i.lvl}" title="${esc(i.txt)}">${SHORTTAG[i.tag]||i.tag}</span>`:''};
function experts(p){if(p.ecr==null||p.rank==null)return null;const gap=p.ecr-p.rank;return {gap,big:Math.abs(gap)>=12}}

/* ---------- shell ---------- */
function header(){
  $('#stamp').textContent=`Week ${M.week}, updated ${M.updated.replace(' ET','')}`;
  $('#foot').innerHTML=`<button class="linkish" id="footLive">Model vs experts vs Vegas</button><p style="margin-top:8px">nflverse · ESPN · Sleeper · Vegas · FantasyPros. Updated hourly.</p>`;
  $('#footLive').onclick=()=>{howSec='live';go('how')};
}
function go(t){tab=t;store.set('ss_tab',t);$$('.tabbar button').forEach(b=>b.setAttribute('aria-selected',b.dataset.tab===t));
  ['team','ss','wv','rank','def','how'].forEach(id=>$('#s-'+id).hidden=id!==t);
  render(t);window.scrollTo({top:0})}
function render(t){({team:renderTeam,ss:renderSS,wv:renderWV,rank:renderRank,def:renderDef,how:renderHow})[t]()}
$$('.tabbar button').forEach(b=>b.onclick=()=>go(b.dataset.tab));
$$('.fmt button').forEach(b=>{b.setAttribute('aria-pressed',b.dataset.s===S);b.onclick=()=>{S=b.dataset.s;store.set('ss_scoring',S);$$('.fmt button').forEach(x=>x.setAttribute('aria-pressed',x===b));render(tab)}});
addEventListener('scroll',()=>$('#topbar').classList.toggle('scrolled',scrollY>4),{passive:true});

/* ---------- search ---------- */
function norm(s){return s.toLowerCase().normalize('NFD').replace(/-/g,' ').replace(/[^a-z0-9 ]/g,'').replace(/\s+/g,' ').trim()}
function lev(a,b){const m=a.length,n=b.length;if(!m)return n;if(!n)return m;
  const d=[];for(let i=0;i<=m;i++){d[i]=[i];for(let j=1;j<=n;j++)d[i][j]=i?0:j}
  for(let i=1;i<=m;i++)for(let j=1;j<=n;j++){d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));
    if(i>1&&j>1&&a[i-1]===b[j-2]&&a[i-2]===b[j-1])d[i][j]=Math.min(d[i][j],d[i-2][j-2]+1)}
  return d[m][n]}
function nameScore(name,t){const n=norm(name);if(n.includes(t))return 0;const words=n.split(' ');let s=0;
  for(const q of t.split(' ').filter(Boolean)){const allow=q.length<=3?0:q.length<=4?1:2;let best=9;
    for(const w of words){best=Math.min(best,lev(q,w),q.length<w.length?lev(q,w.slice(0,q.length)):9)}
    if(best>allow)return Infinity;s+=best+1}return s}
function findPlayers(list,t){return list.map(p=>[p,p.team.toLowerCase()===t?0:nameScore(p.name,t)]).filter(x=>x[1]<Infinity)
  .sort((a,b)=>a[1]-b[1]||(b[0].proj||b[0].ppg||0)-(a[0].proj||a[0].ppg||0)).map(x=>x[0])}

let sheetCtx=null, sheetActive=0;
function openSheet(ctx){sheetCtx=ctx;
  $('#sheetTitle').textContent=ctx==='drop'?'Who would you drop?':ctx==='add'?'Who would you add?':'Add a player';
  const bg=$('#sheetBg'),sh=$('#sheet');bg.hidden=false;sh.hidden=false;
  requestAnimationFrame(()=>{bg.classList.add('on');sh.classList.add('on')});
  $('#sq').value='';sheetResults();setTimeout(()=>$('#sq').focus(),260);document.body.style.overflow='hidden'}
function closeSheet(){const bg=$('#sheetBg'),sh=$('#sheet');bg.classList.remove('on');sh.classList.remove('on');document.body.style.overflow='';
  setTimeout(()=>{bg.hidden=true;sh.hidden=true},280)}
$('#sheetBg').onclick=closeSheet;$('#sheetClose').onclick=closeSheet;

  let lead=null, verdict='';
  if(open_.length>=2){
    const [a,b]=open_, diff=val(a)-val(b), pr=Phi(diff/Math.sqrt(sd(a)**2+sd(b)**2)), close=pr<0.55, ia=inj(a);

      <div class="tug" role="img" aria-label="${Math.round(pr*100)} to ${100-Math.round(pr*100)}"><i style="width:${pr*100}%"></i></div>
      <div class="tug-l"><span>${esc(short(a.name))}</span><span>${esc(short(b.name))}</span></div></div>
      <div class="yard" role="img" aria-label="Projected points with likely range">${yl}<i class="fd" style="left:${x(val(a))}%"></i>${lanes}</div>
      <div class="legend-i"><span><i class="lg-dot"></i>projection</span><span><i class="lg-rng"></i>likely range</span><span><i class="lg-fd"></i>the pick</span></div></section>`;

const wsc=p=>S==='std'?p.rs:S==='half'?p.rh:1;

/* how it works */

const HOW={
build(){
  const okP=q=>q&&q.pos!=='K'&&!q.bye&&q.src!=='experts'&&q.proj>0;const p=[byId[howPlayer],byId[picks[0]],...P].find(okP);if(!p)return '<p>No projections yet.</p>'; howPlayer=p.id; const k=scale(p);
  const steps=[['Baseline',(p.form+p.usage)*k,`Who ${p.name.split(' ').slice(-1)} is: points scored blended with what his usage is worth.`],
               ['Matchup',p.matchup*k,`${p.opp} allows ${p.xdef>0?'+':''}${fmt(p.xdef,0)}% vs expected to ${p.pos}s.`],
               ['Vegas',p.vegas*k,`${p.team} is expected to score ${fmt(p.imp)}, vs a ${fmt(M.league_imp)} league average.`]];
  const total=val(p); const top=Math.max(total,(p.form+p.usage)*k)*1.08; let run=0;
  const bars=steps.map(([l,v,t],j)=>{const start=j===0?0:run; run+=v; const a=Math.min(start,run),w=Math.abs(v);
    return `<div class="wf-row"><span class="wf-l">${l}</span><div class="wf-track"><div class="wf-bar ${j===0?'b':v<0?'n':'p'}" style="left:${a/top*100}%;width:${Math.max(.6,w/top*100)}%"></div></div><span class="wf-v">${j&&v>0?'+':''}${fmt(v)}</span></div><p class="wf-t">${t}</p>`}).join('');
  const opts=P.filter(q=>q.pos!=='K'&&!q.bye&&q.src!=='experts'&&q.proj>0).sort((a,b)=>a.name.localeCompare(b.name)).map(q=>`<option value="${q.id}" ${q.id===p.id?'selected':''}>${esc(q.name)} (${q.pos}, ${q.team})</option>`).join('');
  return `<h2>Baseline, then this week</h2>
  <p>Every projection starts with who the player is, then adjusts for this week's game.</p>
  <label class="sel">Pick any player <select id="howSel">${opts}</select></label>
  <div class="panel">${bars}<div class="wf-row total"><span class="wf-l">Projection</span><div class="wf-track"><div class="wf-bar t" style="left:0;width:${total/top*100}%"></div></div><span class="wf-v">${fmt(total)}</span></div></div>`},
baseline(){
  const c=M.coef[howPos], tu=c[1]/(c[0]+c[1]);
  return `<h2>Usage beats past points</h2>
  <p>Points include touchdowns and long plays that rarely repeat. Targets and carries do repeat. So the baseline leans on usage, and how much depends on the position.</p>
  <div class="chips" id="bpos">${['QB','RB','WR','TE'].map(q=>`<button data-p="${q}" aria-pressed="${q===howPos}">${q}</button>`).join('')}</div>
  <div class="split"><div class="split-u" style="width:${tu*100}%"><span>Usage ${Math.round(tu*100)}%</span></div><div class="split-p"><span>Points ${Math.round((1-tu)*100)}%</span></div></div>
  <p class="cap">${howPos==='RB'?'Running back workloads are the most stable thing in fantasy, so their baseline is almost all usage.':howPos==='WR'?'Receivers split it evenly: targets matter, but talent turns targets into points at very different rates.':howPos==='QB'?'Quarterbacks lean on usage, which for them is mostly rushing and pass volume.':'Tight ends lean on targets; their touchdowns are especially streaky.'}</p>
  <p>Usage here means targets, carries, air yards and red-zone looks. If a player's snap share is climbing, the model gives him extra credit before the points show up.</p>
  <p>Recent games count more: a game five weeks ago counts half as much as last week's. And when a regular is ruled out, on injured reserve or suspended, about three-quarters of his targets and carries are handed to his teammates, in proportion to their current roles. The card says when that's happening.</p>

live(){

  const SRC=[['blend','The app (blend)','App','s-app'],['model','Model alone','Model','s-model'],['experts','FantasyPros experts','Experts','s-exp'],['vegas','Vegas line','Vegas','s-veg']];
  const posList=['ALL'].concat(['QB','RB','WR','TE','K','DST'].filter(p=>SB.pos[p]));
  if(!posList.includes(lvPos))lvPos='ALL';
  const tot=lvPos==='ALL'?SB.total:SB.pos[lvPos];

    :`Through Week ${last}, the model's projections miss by ${fmt(tot.model.mae,2)} points on average. Experts: ${fmt(tot.experts.mae,2)}. Vegas line: ${fmt(tot.vegas.mae,2)}.`;

    const ticks=[lo+pad,(lo+hi)/2,hi-pad];

function kickoff(p){if(!p||!p.date||!p.time)return null;const g=new Date(`${p.date}T${p.time}:00Z`);

/* the best lineup you can still set: players whose game has started stay where ESPN has them */
function lineupNow(mine,L){
  const lk=mine.filter(x=>x.slot!==20&&x.slot!==21&&locked(x.p)), used={};lk.forEach(x=>used[x.slot]=(used[x.slot]||0)+1);

/* best lineup: fill the narrowest slots first; with nested eligibility (RB, WR, TE, then FLEX) greedy is optimal */
function bestLineup(players,slots,value){
  const pool=players.filter(x=>x.p||x.w).slice(), out=[];
  const order=slots.flatMap(([k,n])=>Array(n).fill(k)).sort((a,b)=>SLOT_OK[a].length-SLOT_OK[b].length);

function moves(){

  const curStart=mine.filter(x=>x.slot!==20&&x.slot!==21), curPts=curStart.reduce((s,x)=>s+wk(x.p),0);
  const ins=mine.filter(x=>(x.slot===20||x.slot===21)&&startIds.has(x.espn)), outs=curStart.filter(x=>!startIds.has(x.espn)), gain=opt.total-curPts;

  const luR=entries=>bestLineup(entries,L.slots,rosV).total, myBase=luR(mine);
  const fas=W.filter(w=>!taken.has(w.id)&&!['K','DST'].includes(w.pos)&&w.status!=='FA').sort((a,b)=>rosT(b)-rosT(a)).slice(0,60);
  const droppable=mine.filter(x=>x.w&&!['K','DST'].includes(x.w.pos)&&x.slot!==21);

    droppable.forEach(d=>{const g=luR(mine.filter(x=>x!==d).concat([ax]))-myBase+.2*(rosT(a)-rosT(d.w));if(!best||g>best.g)best={a,d,g}});

    const p=x.p||x.w, moved=x.slot===20||x.slot===21;
    return `<div class="lu-row${moved?' moved':''}" data-open="${p.id}"><span class="lu-s">${SLOT_NAME[s.slot]}</span>
      <span class="lu-p">${crest(p.team,22)}<span style="min-width:0"><b>${esc(x.name||p.name)}</b><small>${x.p?(x.p.bye?'Bye':x.p.final?'Final':vs(x.p)+' · '+fmtTime(x.p)):'No game data'}${moved?` · <em>from bench</em>`:''}</small></span></span>
      <span class="lu-v">${s.lock?ic('clock'):''}${x.p&&x.p.final&&actual(x.p)!=null?fmt(actual(x.p)):fmt(wk(x.p))}</span></div>`};
  el.innerHTML=`<div class="tm-head"><div><h2 class="h2">${esc(me.name)}</h2><p class="cap">${esc(L.name)} · Week ${M.week}</p></div><button class="iconbtn" id="lgMenu" aria-label="League settings">${ic('users')}</button></div>
    <div class="sec-h"><h3>Moves</h3><small>${mv.length?mv.length+' ideas':''}</small></div>
    ${mv.length?`<div class="moves">${mv.slice(0,8).map((m,i)=>`<button class="mv ${m.tone}" data-mv="${i}"><span class="mv-i">${ic(m.icon)}</span><span class="mv-t"><b>${esc(m.title)}</b><small>${m.sub}</small></span>${ic('flip')}</button>`).join('')}</div>`
      :`<div class="empty"><b>Nothing to change</b>Your lineup is set and no free agent beats your bench.</div>`}
    <div class="sec-h"><h3>Best lineup</h3><small>${fmt(opt.total)} pts${opt.total-curPts>=.3?` · +${fmt(opt.total-curPts)} vs now`:''}</small></div>
    <div class="list lu">${opt.starters.map(lineRow).join('')}</div>
    <div class="sec-h"><h3>Bench</h3></div>
    <div class="list lu">${mine.filter(x=>!startIds.has(x.espn)).map(x=>{const p=x.p||x.w;return p?`<div class="lu-row bench" data-open="${p.id}"><span class="lu-s">${x.slot===21?'IR':'BN'}</span><span class="lu-p">${crest(p.team,22)}<span style="min-width:0"><b>${esc(x.name||p.name)}</b><small>${p.pos}${x.w?' · '+fmt(rosT(x.w),0)+' rest of yr':''}</small></span></span><span class="lu-v">${x.p?fmt(wk(x.p)):''}</span></div>`:`<div class="lu-row bench"><span class="lu-s">BN</span><span class="lu-p"><span><b>${esc(x.name)}</b><small>Not in our data</small></span></span><span></span></div>`}).join('')}</div>
    <p class="cap" style="margin-top:10px">From ESPN ${LG.at?'at '+new Date(LG.at).toLocaleTimeString([], {hour:'numeric',minute:'2-digit'}):''} · <button class="linkish" id="lgRefresh">Refresh</button></p>`;
  $$('#s-team [data-mv]').forEach(b=>b.onclick=()=>doMove(mv[+b.dataset.mv]));
  $$('#s-team [data-open]').forEach(b=>b.onclick=()=>{const id=b.dataset.open;if(byId[id]){picks=[id];save();go('ss')}});
  $('#lgRefresh').onclick=()=>{LG.at=0;refreshLeague(true)};
  $('#lgMenu').onclick=()=>{if(confirm('Switch team or league?')){LG.team=null;store.set('ss_league',LG);renderTeam()}};
}
function doMove(m){const a=m.act;
  if(a.type==='cmp'){picks=a.ids.filter(Boolean);save();go('ss')}
  else if(a.type==='wv'){wv={drop:a.drop,add:a.add};store.set('ss_wv',wv);go('wv')}
  else if(a.type==='add'){if(byId[a.id]){picks=[a.id];save();go('ss')}}
  else if(a.type==='trade'){wv={drop:a.a,add:a.b};store.set('ss_wv',wv);go('wv')}
  else if(a.type==='lineup'){$('#s-team .lu')&&$('#s-team .lu').scrollIntoView({behavior:'smooth',block:'start'})}
  else if(a.type==='open'){if(byId[a.id]){picks=[a.id];save();go('ss')}}}

/* ---------- boot ---------- */
setW();header();
$$('.tabbar button').forEach(b=>b.setAttribute('aria-selected',b.dataset.tab===tab));
['team','ss','wv','rank','def','how'].forEach(id=>$('#s-'+id).hidden=id!==tab);
render(tab);
refreshLeague(false);
</script>
</body>
</html>
