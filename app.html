<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Start/Sit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F2F4EF; --surface:#FFFFFF; --ink:#172033; --muted:#5B6476; --line:#D7DBD2;
  --turf:#2E6B45; --turf-deep:#235536; --chalk:rgba(255,255,255,.55);
  --flag:#F2C230; --flag-ink:#4A3A00; --up:#2E6B45; --down:#B23A3A; --chip:#E6E9E2;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#111714; --surface:#19211C; --ink:#E7ECE5; --muted:#9BA69E; --line:#2B3530;
  --turf:#2F7A4D; --turf-deep:#245E3B; --chip:#232D27; --up:#5FBF84; --down:#E07B7B; }}
:root[data-theme="dark"]{
  --paper:#111714; --surface:#19211C; --ink:#E7ECE5; --muted:#9BA69E; --line:#2B3530;
  --turf:#2F7A4D; --turf-deep:#245E3B; --chip:#232D27; --up:#5FBF84; --down:#E07B7B; }
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--paper);color:var(--ink);font:400 16px/1.5 var(--body);-webkit-font-smoothing:antialiased}
.wrap{max-width:760px;margin:0 auto;padding:20px 18px 64px}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--flag);outline-offset:2px;border-radius:6px}

header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:8px 0 18px;border-bottom:3px solid var(--ink)}
h1{font:800 clamp(44px,11vw,72px)/.85 var(--display);letter-spacing:-.01em;margin:0}
h1 span{display:block;font-weight:600;font-size:.34em;letter-spacing:.01em;color:var(--muted);margin-top:8px}
.scoring{display:flex;background:var(--chip);border-radius:999px;padding:3px;flex-shrink:0}
.scoring button{border:0;background:none;padding:6px 11px;border-radius:999px;font:600 14px var(--display);letter-spacing:.02em;color:var(--muted)}
.scoring button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}

nav{display:flex;gap:4px;margin:14px 0 22px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--paper);z-index:5;padding:8px 0}
nav button{flex:1;border:0;background:none;padding:10px 4px;font:700 18px var(--display);color:var(--muted);border-bottom:3px solid transparent}
nav button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--turf)}

.picker{position:relative;margin-bottom:14px}
.picker input{width:100%;padding:13px 14px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);font:500 16px var(--body)}
.picker input:focus{border-color:var(--turf);outline:none}
.results{position:absolute;left:0;right:0;top:calc(100% + 4px);background:var(--surface);border:1px solid var(--line);border-radius:10px;max-height:320px;overflow:auto;z-index:10;box-shadow:0 12px 30px rgba(0,0,0,.18)}
.results button{display:flex;width:100%;justify-content:space-between;gap:10px;border:0;background:none;padding:11px 14px;text-align:left;border-bottom:1px solid var(--line)}
.results button:hover,.results button.active{background:var(--chip)}
.results small{color:var(--muted)}

.chosen{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--chip);border:0;border-radius:999px;padding:6px 8px 6px 12px;font-weight:500;font-size:15px}
.pill i{font-style:normal;display:grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--line);font-size:13px}

.verdict{margin:6px 0 16px}
.verdict h2{font:800 clamp(34px,8.5vw,52px)/.95 var(--display);margin:0}
.verdict p{margin:8px 0 0;color:var(--muted);max-width:60ch}

/* the field */
.field{position:relative;background:var(--turf);border-radius:6px;padding:30px 0 10px;overflow:hidden;color:#fff;
  background-image:repeating-linear-gradient(90deg,transparent 0 calc(10% - 1px),rgba(255,255,255,.04) calc(10% - 1px) 10%);}
.field .yl{position:absolute;top:0;bottom:0;width:2px;background:var(--chalk);transform:translateX(-1px)}
.field .yl.minor{width:1px;background:rgba(255,255,255,.22)}
.field .num{position:absolute;top:6px;transform:translateX(-50%);font:700 15px var(--display);color:rgba(255,255,255,.75)}
.lane{position:relative;height:58px;margin:0}
.lane .band{position:absolute;top:22px;height:14px;background:rgba(255,255,255,.22);border-radius:7px}
.lane .ball{position:absolute;top:17px;width:24px;height:24px;margin-left:-12px;border-radius:50%;background:#fff;border:3px solid var(--turf-deep);transition:left .5s cubic-bezier(.2,.8,.2,1)}
.lane.lead .ball{background:var(--flag);border-color:#fff}
.lane .tag{position:absolute;top:0;font:700 15px/1 var(--display);white-space:nowrap;transform:translateX(-50%);text-shadow:0 1px 2px rgba(0,0,0,.35)}
.lane .tag.l{transform:none}.lane .tag.r{transform:translateX(-100%)}
.legend{display:flex;justify-content:space-between;color:var(--muted);font-size:13px;margin:8px 2px 26px}

.cards{display:grid;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
.card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.card h3{font:700 26px/1 var(--display);margin:0}
.card .sub{color:var(--muted);font-size:14px;margin-top:4px}
.pts{text-align:right;font:800 40px/.9 var(--display)}
.pts small{display:block;font:500 13px var(--body);color:var(--muted);margin-top:4px}
.flag{display:flex;gap:8px;align-items:flex-start;background:var(--flag);color:var(--flag-ink);border-radius:8px;padding:8px 10px;font-size:14px;font-weight:500;margin-top:12px}
.flag b{font:800 13px var(--display);background:var(--flag-ink);color:var(--flag);padding:1px 5px;border-radius:3px}
.parts{margin-top:14px;display:grid;gap:8px}
.part{display:grid;grid-template-columns:70px 1fr 56px;align-items:center;gap:10px;font-size:14px}
.part .lbl{color:var(--muted)}
.part .track{height:8px;background:var(--chip);border-radius:4px;position:relative}
.part .fill{position:absolute;top:0;bottom:0;border-radius:4px;background:var(--ink)}
.part .fill.neg{background:var(--down)}
.part .fill.pos-adj{background:var(--up)}
.part .v{text-align:right;font:600 16px var(--display)}
.facts{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line);font-size:14px;color:var(--muted)}
.facts b{color:var(--ink);font-weight:600}

.empty{border:2px dashed var(--line);border-radius:12px;padding:28px 20px;text-align:center;color:var(--muted)}
.empty .sugg{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:14px}
.empty button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:500}

.filters{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.filters button{border:1.5px solid var(--line);background:none;border-radius:999px;padding:5px 12px;font:700 15px var(--display)}
.filters button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
table{width:100%;border-collapse:collapse}
.tablewrap{overflow-x:auto}
th{font:600 13px var(--body);color:var(--muted);text-align:left;padding:8px 6px;border-bottom:2px solid var(--ink)}
td{padding:10px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
td.rk{font:700 17px var(--display);color:var(--muted);width:30px}
td.nm{font-weight:600}
td.nm small{display:block;font-weight:400;color:var(--muted);font-size:13px}
td.num,th.num{text-align:right;font-family:var(--display);font-size:18px;font-weight:700}
th.num{font:600 13px var(--body)}
tr.row{cursor:pointer}
tr.row:hover td{background:var(--chip)}
.mu{display:inline-block;min-width:44px;text-align:center;font:700 13px var(--display);padding:2px 6px;border-radius:4px}
.addbtn{border:1.5px solid var(--line);background:none;border-radius:6px;width:30px;height:30px;font-weight:700}
.addbtn[aria-pressed="true"]{background:var(--turf);border-color:var(--turf);color:#fff}

.dz{display:grid;gap:4px}
.dz-row{display:grid;grid-template-columns:44px 1fr 52px;gap:10px;align-items:center;font-size:14px}
.dz-row .t{font:700 16px var(--display)}
.dz-row .axis{position:relative;height:16px}
.dz-row .axis::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:1px;background:var(--line)}
.dz-row .bar{position:absolute;top:3px;height:10px;border-radius:2px}
.dz-row .v{text-align:right;font:600 15px var(--display);color:var(--muted)}
.dz-head{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin:0 52px 6px 54px}

.prose{max-width:62ch}
.prose h2{font:800 32px/1 var(--display);margin:34px 0 10px}
.prose h2:first-child{margin-top:4px}
.prose p{margin:0 0 14px}
.eq{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--turf);border-radius:8px;padding:14px 16px;margin:14px 0 18px;font:600 19px/1.5 var(--display)}
.demo{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;margin:14px 0 20px}
.demo-grid{display:grid;grid-template-columns:auto 1fr 1fr;gap:6px 14px;font-size:15px;align-items:center}
.demo-grid .h{color:var(--muted);font-size:13px}
.demo-grid .val{font:700 18px var(--display);text-align:right}
.demo label{display:block;margin-top:14px;font-size:14px;color:var(--muted)}
.demo input[type=range]{width:100%;accent-color:var(--turf)}
.verdict-demo{margin-top:10px;font-weight:600}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:14px 0 18px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.stat b{display:block;font:800 30px/1 var(--display)}
.stat span{font-size:14px;color:var(--muted)}
footer{margin-top:40px;padding-top:14px;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}
.basenote{font-size:13px;color:var(--muted);margin:-2px 0 4px 80px}
.basenote b{color:var(--ink);font-weight:600}
.adjhead{font:700 15px var(--display);color:var(--muted);margin-top:8px;padding-top:10px;border-top:1px dashed var(--line)}
.part .track.ctr::before{content:"";position:absolute;left:50%;top:-3px;bottom:-3px;width:1px;background:var(--muted)}
@media (max-width:460px){.basenote{margin-left:74px}}
.subnav{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin:0 0 18px;scrollbar-width:none}
.subnav::-webkit-scrollbar{display:none}
.subnav button{flex-shrink:0;border:0;background:var(--chip);border-radius:999px;padding:6px 11px;font:700 15px var(--display);color:var(--muted)}
.subnav button[aria-selected="true"]{background:var(--turf);color:#fff}
.sec{min-height:420px}
.prose .cap{font-size:14px;color:var(--muted);margin-top:-4px}
.pager{display:flex;justify-content:space-between;gap:10px;margin-top:22px;padding-top:14px;border-top:1px solid var(--line)}
.pager button{border:1.5px solid var(--line);background:none;border-radius:8px;padding:9px 14px;font:700 16px var(--display)}
.pager .next{background:var(--ink);color:var(--paper);border-color:var(--ink);margin-left:auto}
.sel{display:block;font-size:14px;color:var(--muted);margin:6px 0 14px}
.sel select{display:block;width:100%;margin-top:6px;padding:11px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);font:500 16px var(--body)}
.wf{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
.wf-row{display:grid;grid-template-columns:76px 1fr 52px;gap:10px;align-items:center}
.wf-l{font-size:14px;color:var(--muted)}.wf-v{text-align:right;font:700 18px var(--display)}
.wf-track{position:relative;height:22px}
.wf-bar{position:absolute;top:0;bottom:0;border-radius:4px;transition:left .4s,width .4s}
.wf-bar.b{background:var(--ink)}.wf-bar.p{background:var(--up)}.wf-bar.n{background:var(--down)}.wf-bar.t{background:var(--turf);outline:2px solid var(--flag);outline-offset:-2px}
.wf-t{font-size:13px;color:var(--muted);margin:2px 0 12px 86px!important;line-height:1.4}
.wf-row.total{padding-top:12px;border-top:1px dashed var(--line)}.wf-row.total .wf-l{color:var(--ink);font-weight:600}
.split{display:flex;height:46px;border-radius:8px;overflow:hidden;margin:4px 0 10px;font:700 16px var(--display)}
.split>div{display:flex;align-items:center;padding:0 12px;white-space:nowrap;transition:width .4s}
.split-u{background:var(--ink);color:var(--paper)}.split-p{flex:1;background:var(--chip);justify-content:flex-end}
.seg{display:inline-flex;background:var(--chip);border-radius:999px;padding:3px;margin:2px 0 10px}
.seg button{border:0;background:none;border-radius:999px;padding:7px 14px;font:600 15px var(--display);color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.dlist{list-style:none;padding:0;margin:0 0 16px;border-top:1px solid var(--line)}
.dlist li{display:grid;grid-template-columns:24px 44px 1fr auto;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.dlist .rk2{color:var(--muted);font:700 15px var(--display)}.dlist .t{font:700 17px var(--display)}.dlist .mv{color:var(--muted);font-size:13px}
.acc{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:grid;gap:10px;margin:4px 0 12px}
.acc-row{display:grid;grid-template-columns:110px 1fr 56px;gap:10px;align-items:center;font-size:14px}
.acc-row b{text-align:right;font:700 18px var(--display)}
.acc-track{height:14px;background:var(--chip);border-radius:3px;position:relative}
.acc-bar{position:absolute;left:0;top:0;bottom:0;border-radius:3px;transition:width .4s}
.acc-bar.n{background:var(--muted)}.acc-bar.m{background:var(--turf)}
.demo small{color:var(--muted)}
@media (max-width:460px){.wf-t{margin-left:0!important}.acc-row{grid-template-columns:96px 1fr 50px}}
@media (prefers-reduced-motion:reduce){.wf-bar,.split>div,.acc-bar{transition:none}}
.flag.out,.flag.bad{background:var(--down);color:#fff}.flag.out b,.flag.bad b{background:#fff;color:var(--down)}
.itag{display:inline-block;font:800 11px/1 var(--display);padding:3px 4px;border-radius:3px;vertical-align:2px;background:var(--flag);color:var(--flag-ink)}
.itag.out,.itag.bad{background:var(--down);color:#fff}
.vsx{margin-top:14px;padding:10px 12px;background:var(--chip);border-radius:8px}
.vsx-top{display:flex;justify-content:space-between;font-size:14px;color:var(--muted)}.vsx-top b{color:var(--ink)}
.vsx-track{position:relative;height:10px;margin:8px 6px 2px;border-top:2px solid var(--line);top:4px}
.vsx-m,.vsx-e{position:absolute;top:-7px;width:12px;height:12px;margin-left:-6px;border-radius:50%}
.vsx-m{background:var(--turf);z-index:1}.vsx-e{background:var(--surface);border:2.5px solid var(--ink)}
.vsx-top .k{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:0}.k.m{background:var(--turf)}.k.e{border:2px solid var(--ink)}
.vsx-hint{font-size:12px}
.vsx-note{font-size:13px;margin-top:6px;color:var(--ink)}
.facts em{font-style:normal;font-weight:600;font-size:13px}.facts em.up{color:var(--up)}.facts em.dn{color:var(--down)}
.h3{font:700 20px var(--display);margin:22px 0 8px}.h3 small{font:400 14px var(--body);color:var(--muted)}
.mode{display:flex;margin:0 0 16px}.mode button{flex:1}
.slots{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px}
.slot{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;min-width:0}
.slot label{display:block;font:700 15px var(--display);color:var(--muted);margin-bottom:6px}
.slot .picker{margin:0}.slot input{padding:10px;font-size:15px}
.slot .pill{width:100%;justify-content:space-between;background:var(--chip)}
.k{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px}.k.d{background:var(--muted)}.k.a{background:var(--turf)}
.wvsum{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.wvsum>div{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-weight:600;font-size:15px}
.wvsum b{display:block;font:800 34px/1 var(--display);margin:6px 0 2px}.wvsum small{color:var(--muted);font-weight:400;font-size:13px}
.wkchart{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:3px;height:120px;align-items:end;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 8px 6px}
.wk{display:flex;flex-direction:column;height:100%;min-width:0}
.wk-bars{flex:1;display:flex;align-items:flex-end;gap:1px}
.wk-bars .b{flex:1;border-radius:2px 2px 0 0}.b.d{background:var(--muted);opacity:.55}.b.a{background:var(--turf)}
.wk-l{text-align:center;font:600 11px var(--display);color:var(--muted);margin-top:3px}.wk-l b{font-size:9px;color:var(--down)}
.notes{display:grid;gap:6px;margin:12px 0}
.notes .n{margin:0;padding:8px 10px;border-radius:8px;font-size:14px;background:var(--chip)}
.notes .n.up{border-left:4px solid var(--up)}.notes .n.dn,.notes .n.warn{border-left:4px solid var(--flag)}
.rise{color:var(--up);font-size:12px}.per{display:block;font:500 12px var(--body);color:var(--muted)}
#wvWrap,#compare{scroll-margin-top:70px}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){.lane .ball{transition:none}}
@media (max-width:460px){.part{grid-template-columns:64px 1fr 48px}.pts{font-size:34px}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>Start/Sit<span id="sub">Week 4 projections</span></h1>
  <div class="scoring" role="group" aria-label="Scoring format">
    <button data-s="proj" aria-pressed="true">PPR</button><button data-s="half" aria-pressed="false">Half</button><button data-s="std" aria-pressed="false">Std</button>
  </div>
</header>
<nav role="tablist">
  <button role="tab" data-tab="compare" aria-selected="true">Compare</button>
  <button role="tab" data-tab="rank" aria-selected="false">Rankings</button>
  <button role="tab" data-tab="def" aria-selected="false">Matchups</button>
  <button role="tab" data-tab="how" aria-selected="false">Method</button>
</nav>

<section id="compare">
  <div class="seg mode" role="group" aria-label="Mode"><button data-m="ss" aria-pressed="true">Start/Sit</button><button data-m="wv" aria-pressed="false">Waivers</button></div>
  <div id="ssWrap">
  <div class="picker">
    <input id="q" type="search" placeholder="Add a player to compare" autocomplete="off" aria-label="Search players">
    <div class="results" id="results" hidden></div>
  </div>
  <div class="chosen" id="chosen"></div>
  <div id="cmpOut"></div>
  </div>
  <div id="wvWrap" hidden>
    <div class="slots">
      <div class="slot"><label for="wv_drop"><span class="k d"></span>Drop</label><div id="wvc_drop"></div><div class="picker"><input id="wv_drop" type="search" placeholder="Player on your roster" autocomplete="off"><div class="results" id="wvr_drop" hidden></div></div></div>
      <div class="slot"><label for="wv_add"><span class="k a"></span>Add</label><div id="wvc_add"></div><div class="picker"><input id="wv_add" type="search" placeholder="Player on waivers" autocomplete="off"><div class="results" id="wvr_add" hidden></div></div></div>
    </div>
    <div id="wvOut"></div>
  </div>
</section>

<section id="rank" hidden>
  <div class="filters" id="posf"></div>
  <div class="tablewrap"><table><thead><tr><th>#</th><th>Player</th><th>Matchup</th><th class="num">Proj</th><th></th></tr></thead><tbody id="rankBody"></tbody></table></div>
</section>

<section id="def" hidden>
  <p style="margin-top:0;color:var(--muted);max-width:60ch">How many fantasy points each defense gives up to a position, compared with what those players normally score. Right of center means the defense has been easy to score on.</p>
  <div class="filters" id="deff"></div>
  <div class="dz-head"><span>Tougher</span><span>Softer</span></div>
  <div class="dz" id="dzOut"></div>
</section>

<section id="how" hidden><div class="prose" id="howOut"></div></section>

<footer id="foot"></footer>

    out.querySelectorAll('.sugg button').forEach(b=>b.onclick=()=>add(b.dataset.id)); return}

  else{head=`Start ${esc(a.name)}.`;why=`Projected ${fmt(diff)} points ahead of ${esc(b.name)}. Outscores ${esc(lastName(b.name))} about ${Math.round(pr*100)}% of the time.`}
  const ia=inj(a);

  else if(ia){head=`Start ${esc(a.name)}, if he plays.`;why+=` ${esc(lastName(a.name))} has an injury flag, so confirm he's active before lineups lock.`}

/* defense */
function renderDef(){
  $('#deff').innerHTML=['QB','RB','WR','TE'].map(p=>`<button data-p="${p}" aria-pressed="${p===defPos}">vs ${p}</button>`).join('');
  $('#deff').querySelectorAll('button').forEach(b=>b.onclick=()=>{defPos=b.dataset.p;renderDef()});
  const rows=DATA.defense[defPos]; const m=Math.max(...rows.map(r=>Math.abs(r.z)),1);
  $('#dzOut').innerHTML=rows.map(r=>{const w=Math.abs(r.z)/m*50;const pos=r.z>=0;
    return `<div class="dz-row"><span class="t">${r.team}</span><div class="axis"><div class="bar" style="${pos?'left:50%':'right:50%'};width:${w}%;background:${pos?'var(--up)':'var(--down)'}"></div></div><span class="v">${r.adj>0?'+':''}${fmt(r.adj)}</span></div>`}).join('')+
  `<p style="font-size:13px;color:var(--muted);margin-top:12px">Number = fantasy points per game allowed above (+) or below (−) what the opposing ${defPos}s usually score. This season counts fully; last season counts about a third as much.</p>`;
}

/* how it works */
let howSec='build', howPlayer=null, howPos='RB', defMode='adj', accPos='ALL', normW=50;
const SECS=[['build','The idea'],['baseline','Baseline'],['norm','Normalizing'],['matchup','Matchups'],['acc','Accuracy']];
function renderHow(){
  const i=SECS.findIndex(s=>s[0]===howSec);
  const nav=`<div class="subnav" role="tablist" aria-label="Method sections">${SECS.map(([k,l])=>`<button role="tab" data-k="${k}" aria-selected="${k===howSec}">${l}</button>`).join('')}</div>`;
  const pager=`<div class="pager">${i>0?`<button data-k="${SECS[i-1][0]}">Back: ${SECS[i-1][1]}</button>`:'<span></span>'}${i<SECS.length-1?`<button class="next" data-k="${SECS[i+1][0]}">Next: ${SECS[i+1][1]}</button>`:''}</div>`;
  $('#howOut').innerHTML=nav+`<div class="sec">${HOW[howSec]()}</div>`+pager;
  $('#howOut').querySelectorAll('.subnav button,.pager button').forEach(b=>b.onclick=()=>{howSec=b.dataset.k;renderHow();if(b.closest('.pager'))$('#howOut').scrollIntoView({block:'start'})});
  WIRE[howSec]&&WIRE[howSec]();
}
const HOW={
build(){
  const p=byId[howPlayer]||byId[picks[0]]||P[0]; howPlayer=p.id; const k=scale(p);
  const steps=[['Baseline',(p.form+p.usage)*k,`Who ${p.name.split(' ').slice(-1)} is: points scored blended with what his usage is worth.`],
               ['Matchup',p.matchup*k,`${p.opp} allows ${p.xdef>0?'+':''}${fmt(p.xdef,0)}% vs expected to ${p.pos}s.`],
               ['Vegas',p.vegas*k,`${p.team} is expected to score ${fmt(p.imp)}, vs a ${fmt(M.league_imp)} league average.`]];
  const total=val(p); const top=Math.max(total,(p.form+p.usage)*k)*1.08; let run=0;
  const bars=steps.map(([l,v,t],j)=>{const start=j===0?0:run; run+=v; const a=Math.min(start,run),w=Math.abs(v);
    return `<div class="wf-row"><span class="wf-l">${l}</span><div class="wf-track"><div class="wf-bar ${j===0?'b':v<0?'n':'p'}" style="left:${a/top*100}%;width:${Math.max(.6,w/top*100)}%"></div></div><span class="wf-v">${j&&v>0?'+':''}${fmt(v)}</span></div><p class="wf-t">${t}</p>`}).join('');
  const opts=[...P].sort((a,b)=>a.name.localeCompare(b.name)).map(q=>`<option value="${q.id}" ${q.id===p.id?'selected':''}>${esc(q.name)} (${q.pos}, ${q.team})</option>`).join('');
  return `<h2>Baseline, then this week</h2>
  <p>Every projection starts with who the player is, then adjusts for this week's game.</p>
  <label class="sel">Pick any player <select id="howSel">${opts}</select></label>
  <div class="wf">${bars}<div class="wf-row total"><span class="wf-l">Projection</span><div class="wf-track"><div class="wf-bar t" style="left:0;width:${total/top*100}%"></div></div><span class="wf-v">${fmt(total)}</span></div></div>`},
baseline(){
  const c=M.coef[howPos], tu=c[1]/(c[0]+c[1]);
  return `<h2>Usage beats past points</h2>
  <p>Points include touchdowns and long plays that rarely repeat. Targets and carries do repeat. So the baseline leans on usage, and how much depends on the position.</p>
  <div class="filters" id="bpos">${['QB','RB','WR','TE'].map(q=>`<button data-p="${q}" aria-pressed="${q===howPos}">${q}</button>`).join('')}</div>
  <div class="split"><div class="split-u" style="width:${tu*100}%"><span>Usage ${Math.round(tu*100)}%</span></div><div class="split-p"><span>Points ${Math.round((1-tu)*100)}%</span></div></div>
  <p class="cap">${howPos==='RB'?'Running back workloads are the most stable thing in fantasy, so their baseline is almost all usage.':howPos==='WR'?'Receivers split it evenly: targets matter, but talent turns targets into points at very different rates.':howPos==='QB'?'Quarterbacks lean on usage, which for them is mostly rushing and pass volume.':'Tight ends lean on targets; their touchdowns are especially streaky.'}</p>
  <p>Usage here means targets, carries, air yards and red-zone looks. If a player's snap share is climbing, the model gives him extra credit before the points show up.</p>
  <p>Past points also get blended with last season, so a hot three-week start counts, but doesn't take over.</p>`},
norm(){
  return `<h2>Why normalize?</h2>
  <p>A defense allows about 22 points but 335 yards a game. Add them raw and yards drown everything out. Normalizing puts every stat on the same ruler, so a weight means what you set it to.</p>
  <div class="demo">
    <div class="demo-grid">
      <span class="h"></span><span class="h" style="text-align:right">Raw</span><span class="h" style="text-align:right">Normalized</span>
      <span>Defense A <small>allows few points, lots of yards</small></span><span class="val" id="dA1"></span><span class="val" id="dA2"></span>
      <span>Defense B <small>the reverse</small></span><span class="val" id="dB1"></span><span class="val" id="dB2"></span>
    </div>
    <label for="wslide">Weight on points vs yards: <b id="wl"></b></label>
    <input type="range" id="wslide" min="0" max="100" value="${normW}">
    <div class="verdict-demo" id="dv"></div>
  </div>
  <p class="cap">Drag it. Raw keeps picking A until points get about 90% of the weight. Normalized flips near 50/50, which is what a 50/50 weight should do.</p>`},
matchup(){
  const rows=DATA.defense[howPos];
  const ra=[...rows].sort((a,b)=>b.raw-a.raw).map(r=>r.team), ad=[...rows].sort((a,b)=>b.adj-a.adj).map(r=>r.team);
  const list=(defMode==='raw'?ra:ad).slice(0,8).map((t,j)=>{const r=rows.find(x=>x.team===t);const other=(defMode==='raw'?ad:ra).indexOf(t);const mv=other-j;
    return `<li><span class="rk2">${j+1}</span><span class="t">${t}</span><span class="v2">${defMode==='raw'?fmt(r.raw)+' pts/g':(r.adj>0?'+':'')+fmt(r.adj)+' vs expected'}</span><span class="mv">${defMode==='raw'?'adjusted':'raw'} #${other+1}</span></li>`}).join('');
  return `<h2>Grade defenses on who they faced</h2>
  <p>A defense that faced three star receivers looks awful on raw points even if it isn't. So each defense is graded against what its opponents normally score.</p>
  <div class="filters" id="mpos">${['QB','RB','WR','TE'].map(q=>`<button data-p="${q}" aria-pressed="${q===howPos}">vs ${q}</button>`).join('')}</div>
  <div class="seg" role="group"><button data-m="raw" aria-pressed="${defMode==='raw'}">Raw points allowed</button><button data-m="adj" aria-pressed="${defMode==='adj'}">Adjusted</button></div>
  <p class="cap">Easiest matchups, this season. Toggle to see who moves.</p>
  <ol class="dlist">${list}</ol>
  <p>Honest note: matchup ended up the smallest piece of the model. Defenses swing a lot week to week, so the model only nudges for them.</p>`},
acc(){
  const bt=M.backtest, by=bt.bypos, L=M.live, X=M.expert;
  const pos=accPos==='ALL'?[bt.close_naive,bt.close_model]:by[accPos];
  const sc=v=>Math.max(0,(v-50)/15*100);
  const bar=(lbl,v,cls)=>`<div class="acc-row"><span>${lbl}</span><div class="acc-track"><div class="acc-bar ${cls}" style="width:${sc(v)}%"></div></div><b>${fmt(v)}%</b></div>`;
  return `<h2>Does it pick the right player?</h2>
  <p>The test: two players at the same position whose season averages were within 3 points. Which one scores more? A coin flip gets 50%, so the bars start there.</p>
  <h3 class="h3">Last season <small>(${bt.test}, never seen in training)</small></h3>
  <div class="filters" id="apos">${['ALL','QB','RB','WR','TE'].map(q=>`<button data-p="${q}" aria-pressed="${q===accPos}">${q==='ALL'?'All':q}</button>`).join('')}</div>
  <div class="acc">${bar('Season average',pos[0],'n')}${bar('This model',pos[1],'m')}</div>
  ${M.ros_backtest?`<h3 class="h3">Rest of season <small>(used for waivers)</small></h3><div class="acc">${bar('Season average',M.ros_backtest.close_naive,'n')}${bar('This model',M.ros_backtest.close_model,'m')}</div><p class="cap">Same test, but over the rest of the ${bt.test} season instead of one week. Usage predicts the long run even better than it predicts next week.</p>`:''}
  <h3 class="h3">This season so far</h3>
  ${L?`<div class="acc">${bar('Season average',L.close_naive,'n')}${bar('This model',L.close_model,'m')}</div><p class="cap">Weeks ${L.weeks[0]}–${L.weeks[1]}. Early and small, so expect this to settle closer to last season's numbers.</p>`:'<p class="cap">Starts scoring after Week 2.</p>'}
  <h3 class="h3">Versus the experts</h3>
  ${X?`<div class="acc">${bar('FantasyPros',X.pair_expert,'n')}${bar('This model',X.pair_model,'m')}</div><p class="cap">Every same-position pair, Week${X.weeks.length>1?'s':''} ${X.weeks.join(', ')}. Average miss: model ${fmt(X.mae_model,2)} pts, experts ${fmt(X.mae_expert,2)} pts.</p>`
     :`<p class="cap">Each week the app saves its projections next to the FantasyPros consensus, then scores both once the games are played. The first head-to-head shows up after Week ${M.week}.</p>`}
  <p>The model can't see injury news the way experts can. When the two disagree by a lot, the card says so, and that's usually the reason.</p>`}
};
const WIRE={
build(){const s=$('#howSel');s.onchange=()=>{howPlayer=s.value;renderHow()}},
baseline(){$('#bpos').querySelectorAll('button').forEach(b=>b.onclick=()=>{howPos=b.dataset.p;renderHow()})},
matchup(){$('#mpos').querySelectorAll('button').forEach(b=>b.onclick=()=>{howPos=b.dataset.p;renderHow()});document.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{defMode=b.dataset.m;renderHow()})},
acc(){$('#apos').querySelectorAll('button').forEach(b=>b.onclick=()=>{accPos=b.dataset.p;renderHow()})},
norm(){
  const A={pts:17,yds:390},B={pts:28,yds:300},mu={pts:22,yds:335},sdv={pts:4,yds:30};
  const upd=()=>{normW=+$('#wslide').value;const w=normW/100;$('#wl').textContent=`${Math.round(w*100)}% points / ${Math.round((1-w)*100)}% yards`;
    const raw=d=>w*d.pts+(1-w)*d.yds, nz=d=>w*(d.pts-mu.pts)/sdv.pts+(1-w)*(d.yds-mu.yds)/sdv.yds;
    $('#dA1').textContent=fmt(raw(A));$('#dB1').textContent=fmt(raw(B));$('#dA2').textContent=(nz(A)>0?'+':'')+fmt(nz(A),2);$('#dB2').textContent=(nz(B)>0?'+':'')+fmt(nz(B),2);
    const rw=raw(A)>raw(B)?'A':'B', nw=Math.abs(nz(A)-nz(B))<.05?'tie':nz(A)>nz(B)?'A':'B';
    $('#dv').textContent=`Easier matchup: raw says ${rw}, normalized says ${nw==='tie'?'tie':nw}.`};
  $('#wslide').oninput=upd; upd()}
};
/* waivers */
let mode=store.get('ss_mode','ss'), wvPos='ALL', wv=store.get('ss_wv',{drop:null,add:null});
let W=[], wById={};
function setW(){W=DATA.waiver||[];wById=Object.fromEntries(W.map(p=>[p.id,p]));if(!wById[wv.drop])wv.drop=null;if(!wById[wv.add])wv.add=null}
const wsc=p=>S==='std'?p.rs:S==='half'?p.rh:1;
const games=p=>p.wk.filter(x=>x!=null).length;
const nextN=(p,n)=>p.wk.slice(0,n).reduce((a,x)=>a+(x||0),0)*wsc(p);
const rosT=p=>p.ros*wsc(p);
const vorT=p=>rosT(p)-((M.ros_backtest&&M.ros_backtest.repl||{})[p.pos]||0)*games(p)*wsc(p);
const byeWk=p=>{const i=p.wk.findIndex(x=>x==null);return i<0?null:M.week+i};
const ownTxt=p=>p.own==null?'Not in expert rankings, so rarely rostered':`Rostered in ${p.own}% of leagues`;
function setMode(m){mode=m;store.set('ss_mode',m);document.querySelectorAll('.mode button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.m===m));$('#ssWrap').hidden=m!=='ss';$('#wvWrap').hidden=m!=='wv';if(m==='wv')renderWaiver()}
function slotPicker(role){
  const inp=$('#wv_'+role), res=$('#wvr_'+role); let act=0;
  const pick=id=>{wv[role]=id;store.set('ss_wv',wv);inp.value='';res.hidden=true;renderWaiver()};
  inp.oninput=()=>{const t=norm(inp.value.trim());if(!t){res.hidden=true;return}
    const h=W.filter(p=>norm(p.name).includes(t)).slice(0,8);act=0;
    res.innerHTML=h.length?h.map((p,i)=>`<button data-id="${p.id}" class="${i?'':'active'}"><span>${esc(p.name)} <small>${p.pos}, ${p.team}</small></span><small>${fmt(p.ppg*wsc(p))}/g</small></button>`).join(''):'<div style="padding:12px 14px;color:var(--muted)">No match.</div>';
    res.hidden=false;res.querySelectorAll('button').forEach(b=>b.onclick=()=>pick(b.dataset.id))};
  inp.onkeydown=e=>{const bs=[...res.querySelectorAll('button')];if(res.hidden||!bs.length)return;
    if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();act=(act+(e.key==='ArrowDown'?1:-1)+bs.length)%bs.length;bs.forEach((b,i)=>b.classList.toggle('active',i===act))}
    if(e.key==='Enter')pick(bs[act].dataset.id);if(e.key==='Escape')res.hidden=true};
}
function renderWaiver(){
  if(!W.length){$('#wvOut').innerHTML='<div class="empty">Waiver data will appear after the next update.</div>';return}
  const d=wById[wv.drop], a=wById[wv.add];
  ['drop','add'].forEach(r=>{const p=wById[wv[r]];$('#wvc_'+r).innerHTML=p?`<button class="pill" data-r="${r}" aria-label="Clear">${esc(p.name)} <i aria-hidden="true">✕</i></button>`:'';
    const b=$('#wvc_'+r).querySelector('button');if(b)b.onclick=()=>{wv[r]=null;store.set('ss_wv',wv);renderWaiver()};
    $('#wv_'+r).hidden=!!p});
  let html='';
  if(d&&a){
    const ta=rosT(a),td=rosT(d),na=games(a),nd=games(d),gain=ta-td,sd=(M.ros_backtest?.sd||3.6);
    const z=gain/(sd*Math.sqrt(na*na*wsc(a)**2+nd*nd*wsc(d)**2)||1), pr=Phi(z);
    const n4=nextN(a,4)-nextN(d,4);
    const ln=x=>x.name.split(' ').slice(1).join(' ')||x.name;
    let head, why;
    if(pr>=.6&&gain>=8){head=`Make the move.`;why=`${esc(a.name)} projects <b>${fmt(gain,0)} more points</b> than ${esc(d.name)} the rest of the way, and comes out ahead about ${Math.round(pr*100)}% of the time.`}
    else if(pr<=.4||gain<=-8){head=`Keep ${esc(d.name)}.`;why=`${esc(ln(d))} projects ${fmt(Math.abs(gain),0)} more points the rest of the way and comes out ahead about ${Math.round((1-pr)*100)}% of the time.`}
    else{head=`Close call.`;why=`Only ${fmt(Math.abs(gain),0)} points apart over the rest of the season (${Math.round(Math.max(pr,1-pr)*100)}% for ${esc(ln(gain>=0?a:d))}). Let upside, byes, or roster need decide.`}
    if(Math.sign(n4)!==Math.sign(gain)&&Math.abs(n4)>=3)why+=` Over the next 4 weeks it flips: ${esc(ln(n4>0?a:d))} is ${fmt(Math.abs(n4),0)} points better, mostly from ${byeWk(n4>0?d:a)?'a bye':'schedule'}.`;
    if(a.pos!==d.pos)why+=` Different positions, so make sure you can still fill your lineup.`;
    const notes=[];
    if(a.trend>=8)notes.push(['up',`${esc(ln(a))}'s snap share is up ${a.trend} points lately. A growing role is the classic waiver win, and the model is a little slow to fully credit it.`]);
    if(d.trend<=-8)notes.push(['dn',`${esc(ln(d))}'s snap share is down ${-d.trend} points. His role may be shrinking.`]);
    if(d.trend>=8)notes.push(['warn',`${esc(ln(d))}'s role is growing (+${d.trend} snap share). Be careful dropping him.`]);
    if(a.status)notes.push(['warn',`${esc(ln(a))} is listed ${a.status} this week.`]);
    if(d.own!=null&&d.own>=60)notes.push(['warn',`${esc(ln(d))} is rostered in ${d.own}% of leagues, so he probably won't be there if you want him back.`]);
    if(a.own!=null&&a.own>=60)notes.push(['warn',`${esc(ln(a))} is rostered in ${a.own}% of leagues. Check he's actually available.`]);
    if(a.cv>d.cv+.15)notes.push(['up',`${esc(ln(a))} is the higher-variance player: more big weeks, more duds.`]);
    const mx=Math.max(...a.wk.concat(d.wk).map((x,i)=>(x||0)*wsc(i<a.wk.length?a:d)),1);
    const cols=a.wk.map((x,i)=>{const y=d.wk[i];const h=v=>v==null?0:Math.max(3,v/mx*100);
      return `<div class="wk"><div class="wk-bars"><span class="b d" style="height:${h(y==null?null:y*wsc(d))}%"></span><span class="b a" style="height:${h(x==null?null:x*wsc(a))}%"></span></div>
      <div class="wk-l">${x==null||y==null?'<b>BYE</b>':M.week+i}</div></div>`}).join('');
    html=`<div class="verdict"><h2>${head}</h2><p>${why}</p></div>
    <div class="wvsum">
      <div><span class="k d"></span>${esc(ln(d))} <small>drop</small><b>${fmt(td,0)}</b><small>${nd} games, ${fmt(d.ppg*wsc(d))}/g</small></div>
      <div><span class="k a"></span>${esc(ln(a))} <small>add</small><b>${fmt(ta,0)}</b><small>${na} games, ${fmt(a.ppg*wsc(a))}/g</small></div>
    </div>
    <div class="wkchart" role="img" aria-label="Projected points each remaining week">${cols}</div>
    <p class="cap">Projected points each week through Week 18. Gaps are bye weeks.</p>
    ${notes.length?`<div class="notes">${notes.map(([c,t])=>`<p class="n ${c}">${t}</p>`).join('')}</div>`:''}
    <div class="facts" style="margin-top:6px"><span>${esc(ln(d))}: ${ownTxt(d)}</span><span>${esc(ln(a))}: ${ownTxt(a)}</span></div>`;
  } else {
    html=`<div class="empty"><strong style="color:var(--ink)">${!d&&!a?'Pick who you\'d drop and who you\'d add.':!d?'Now pick who you\'d drop.':'Now pick who you\'d add, or tap one below.'}</strong><br>Projections run through Week 18, including bye weeks.</div>`;
  }
  // best available
  const pool=W.filter(p=>(p.own==null?p.vor<0:p.own<50)&&p.id!==wv.drop&&(wvPos==='ALL'||p.pos===wvPos))
    .sort((x,y)=>wvPos==='ALL'?vorT(y)-vorT(x):rosT(y)-rosT(x)).slice(0,12);
  html+=`<h3 class="h3" style="margin-top:28px">Best available</h3><p class="cap" style="margin-top:-4px">Rostered in fewer than half of leagues. Number is projected points through Week 18${wvPos==='ALL'?', ranked against a typical starter at each position so QBs don\'t crowd out everyone else':''}.</p>
  <div class="filters" id="wvf">${['ALL','QB','RB','WR','TE'].map(q=>`<button data-p="${q}" aria-pressed="${q===wvPos}">${q==='ALL'?'All':q}</button>`).join('')}</div>
  <table><tbody>${pool.map((p,i)=>`<tr class="row" data-id="${p.id}"><td class="rk">${i+1}</td><td class="nm">${esc(p.name)}${p.trend>=8?' <span class="rise" title="Snap share rising">▲</span>':''}<small>${p.pos}, ${p.team} · ${p.own==null?'unranked':p.own+'% rostered'}${byeWk(p)?` · bye Wk ${byeWk(p)}`:''}</small></td><td class="num">${fmt(rosT(p),0)}<small class="per">${fmt(p.ppg*wsc(p))}/g</small></td><td><button class="addbtn" data-id="${p.id}" aria-pressed="${wv.add===p.id}" aria-label="Set as add">${wv.add===p.id?'✓':'+'}</button></td></tr>`).join('')}</tbody></table>`;
  $('#wvOut').innerHTML=html;
  $('#wvf').querySelectorAll('button').forEach(b=>b.onclick=()=>{wvPos=b.dataset.p;renderWaiver()});
  $('#wvOut').querySelectorAll('tr.row').forEach(r=>r.onclick=()=>{wv.add=r.dataset.id;store.set('ss_wv',wv);renderWaiver();$('#wvWrap').scrollIntoView({block:'start'})});
}

function renderAll(){renderCompare();renderRank();renderDef();setW();if(mode==='wv')renderWaiver();if(typeof renderHow==='function'&&$('#howOut').innerHTML)renderHow()}
document.querySelectorAll('.mode button').forEach(b=>b.onclick=()=>setMode(b.dataset.m));slotPicker('drop');slotPicker('add');
setW();renderAll();renderHow();setMode(mode);
loadLive();
</script>
